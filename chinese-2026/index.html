const units=[
{title:"第一单元：四季美景",desc:"学习朗读，品味文中的精彩语句，体会汉语之美。",lessons:[
{title:"1 春",author:"朱自清",type:"现代文阅读",intro:"本文以细腻、生动的笔触描绘春回大地的景象，依次呈现春草、春花、春风、春雨以及迎春等画面，表达作者对春天的喜爱与赞美。",focus:["梳理文章描写春景的层次，理解作者由景及人的写作思路。","品味比喻、拟人等修辞手法，体会语言的准确、生动与富有表现力。","学习调动视觉、听觉、嗅觉、触觉等感官描写景物。"],words:"朗润、酝酿、卖弄、宛转、嘹亮、黄晕、烘托、静默、舒活、欣欣然",method:"抓住景物特征；多感官描写；比喻与拟人；动静结合；由景物描写表达情感。",structure:{"thesis":"作者通过描绘春回大地、生机勃发的景象，表达对春天的喜爱、赞美，以及对美好生活的向往。","parts":[["盼春","开篇反复表达盼望，点明春天即将到来。"],["绘春·春草图","写小草萌发、柔嫩、富有生命力的特点。"],["绘春·春花图","写花朵争艳、花香四溢、蜂蝶飞舞的景象。"],["绘春·春风图","从触觉、嗅觉、听觉等角度写春风的温柔。"],["绘春·春雨图","写春雨细密轻柔，以及雨中安静祥和的乡村景象。"],["绘春·迎春图","写人们走出家门、舒活筋骨，表现春天带来的希望。"],["赞春","用三个比喻赞美春天的新、美、力量。"]]},vocab:[["朗润","lǎng rùn","明亮滋润，形容山色明朗、润泽。","bright and moist"],["酝酿","yùn niàng","原指造酒发酵；文中指各种气息在空气里逐渐浓郁。","brew; develop gradually"],["卖弄","mài nong","有意显示、炫耀（含贬义或调侃意味）。","show off; flaunt"],["喉咙","hóu long","咽喉部分，泛指发声器官。","throat"],["应和","yìng hè","（声音、语言、行动等）相呼应。","echo; respond in tune"],["嘹亮","liáo liàng","（声音）清晰响亮。","clear and resonant"],["烘托","hōng tuō","通过侧面描写，使主要事物更鲜明。","set off; bring into relief"],["静默","jìng mò","寂静，没有声音；沉默不语。","silent; still"],["风筝","fēng zheng","一种借风力升空的玩具。","kite"],["抖擞","dǒu sǒu","振作；奋发。","brace up; feel invigorated"],["健壮","jiàn zhuàng","健康而强壮。","strong and healthy"],["呼朋引伴","hū péng yǐn bàn","呼唤朋友，招引同伴。","call friends and gather companions"],["花枝招展","huā zhī zhāo zhǎn","形容女子打扮得十分艳丽；文中比喻姿态优美。","dressed up beautifully; blooming and graceful"]],focusVocab:[["朗润","形容声音清晰响亮，也形容明朗润泽。课文中写春山、春水、春日的光彩。","山朗润起来了，水涨起来了，太阳的脸红起来了。","注意结合语境，这里突出春天山水明朗、滋润的特点。"],["酝酿","本义是造酒时发酵；课文中比喻各种气息、情感逐渐积聚成熟。","各种花的香都在微微润湿的空气里酝酿。","常用于“酝酿气氛、酝酿情绪、酝酿计划”等表达。"],["卖弄","有意显示、炫耀（含贬义或不够庄重的意味）。","鸟儿将巢安在繁花嫩叶当中，高兴起来了，呼朋引伴地卖弄清脆的喉咙。","与“展示”不同，“卖弄”常带有刻意炫耀的感情色彩。"],["宛转","形容声音抑扬动听；也可形容曲折。","唱出宛转的曲子。","在课文语境中形容鸟鸣婉转悦耳。"],["花枝招展","形容女子打扮得十分艳丽；课文中用拟人写春天花木繁盛、姿态美好。","春天像小姑娘，花枝招展的，笑着，走着。","注意不要只按字面理解为“树枝招手”，要理解其形象表达。"]],qs:[{q:"《春》一文主体部分描绘春景时，主要采用了怎样的组织方式？",a:["按照春草、春花、春风、春雨、迎春等画面展开","按照春天到夏天的时间顺序展开","按照城市到乡村的空间顺序展开"],correct:0,why:"文章主体部分以多个春景图构成，层次清晰，最后写人们迎春的活动。"},{q:"学习本文的景物描写，最值得借鉴的方法是？",a:["只使用形容词进行静态罗列","抓住特征并调动多种感官，运用修辞细致描写","大量引用抽象议论代替具体描写"],correct:1,why:"《春》通过视觉、听觉、嗅觉、触觉等多角度描写，使景物具体可感。"}]},
{title:"2 济南的冬天",author:"老舍",type:"现代文阅读",intro:"作者抓住济南冬天“温晴”的特点，描写阳光下的小山、薄雪覆盖的小山以及城外远山等景物，展现济南冬天温暖、秀美、安适的特点。",focus:["把握济南冬天“温晴”的总体特征。","理解文章如何围绕中心特征组织不同层次的景物描写。","体会拟人、比喻等表达方式及其营造的亲切氛围。"],words:"响晴、温晴、安适、慈善、肌肤、秀气、宽敞、贮蓄、澄清、空灵",method:"紧扣景物特征；对比衬托；比喻、拟人；由整体到局部；情景交融。",structure:{"thesis":"作者抓住济南冬天“温晴”的特点，描写阳光、小山、薄雪、城外远山和绿水，表达对济南冬天的喜爱与赞美。","parts":[["总写·温晴宝地","通过与北平、伦敦、热带的冬天对比，突出济南冬天温晴的特点。"],["阳光下的小山","写小山环抱济南的地理环境和温暖安适的氛围。"],["雪后的小山","从山上、山尖、山坡到山腰，描绘薄雪覆盖下的秀美景色。"],["城外远山","以水墨画作比，写城外小村庄和薄雪的淡雅景象。"],["由水到天空","描写绿藻、澄清河水和蓝天，表现冬日济南清亮空灵的境界。"],["收束全文","以“这就是冬天的济南”总结全文，流露赞美之情。"]]},vocab:[["镶","xiāng","把物体嵌入另一物体内或围在另一物体边缘。","inlay; edge"],["单单","dān dān","仅仅；只有。","only; solely"],["安适","ān shì","安静而舒适。","peaceful and comfortable"],["着落","zhuó luò","可以依靠或指望的来源；归宿。","support; place to rely on"],["慈善","cí shàn","对人关怀，富有同情心。","kind; charitable"],["肌肤","jī fū","肌肉和皮肤。","skin"],["秀气","xiù qi","清秀；（器物、景物）精巧雅致。","delicate; pretty"],["宽敞","kuān chang","宽阔、开阔。","spacious"],["贮蓄","zhù xù","储存、积存。","store; accumulate"],["澄清","chéng qīng","清亮；清澈。","clear; limpid"],["空灵","kōng líng","灵活而不可捉摸；文中形容清净、透明。","ethereal; airy"],["地毯","dì tǎn","铺在地面上的毯子。","carpet"]],focusVocab:[["响晴","（天空）晴朗无云。","济南的冬天是响晴的。","“响”在这里加强语气，突出晴朗、明亮。"],["温晴","温暖晴朗。是贯穿全文、概括济南冬天特点的关键词。","济南的冬天是没有风声的、响晴的。","理解文章时要抓住“温晴”，看山、水、阳光如何共同表现这一特点。"],["安适","安静而舒适。","请闭上眼睛想：一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着。","常用于形容生活、环境或状态舒适平静。"],["慈善","对人关怀，富有同情心。课文用来形容冬天的济南富有温情。","济南的冬天是慈善的。","这里是拟人化表达，不是说冬天真的具有人的道德品质。"],["秀气","清秀、小巧而优美。","山坡上卧着些小村庄，小村庄的房顶上卧着点雪，对，这是张小水墨画，也许是唐代的名手画的吧。","课文用“秀气”表现小雪覆盖下山景的精巧、清秀。"]],qs:[{q:"作者反复表现济南冬天的哪个突出特点？",a:["寒冷干燥","温晴可爱","风雪交加"],correct:1,why:"“温晴”是贯穿全文的核心特点，阳光、小山、薄雪和远山都围绕这一特点展开。"},{q:"文章写小山“把济南围了个圈儿”，表达效果更接近哪一项？",a:["突出山势险峻、难以攀登","将小山人格化，表现济南冬天的温暖与可亲","说明济南城市面积很小"],correct:1,why:"拟人化表达赋予小山温柔亲切的意味，也突出了济南冬天的安适氛围。"}]},
{title:"3* 雨的四季",author:"刘湛秋",type:"自读课文",intro:"文章描写春雨、夏雨、秋雨、冬雨的不同特点，展现四季雨景的变化，表达作者对雨、对自然和生命的热爱。",focus:["比较四季雨的不同特点，梳理文章结构。","品味富有表现力的词语和富于想象的表达。","体会作者在写景中寄寓的情感。"],words:"花苞、娇媚、棱镜、粗犷、莅临、吝啬、淅沥、干涩、草垛",method:"按季节组织材料；多感官描写；拟人、比喻；融情于景。",structure:{"thesis":"作者以四季更替为线索，描写四季雨的不同特点，表达对雨、自然与生命的热爱。","parts":[["春雨","娇媚润泽，写雨后万物复苏。"],["夏雨","热烈粗犷，写雨水滋润万物。"],["秋雨","端庄沉静，写成熟与悠远情思。"],["冬雨","自然平静，写南国冬雨的柔和。"],["结尾","直抒胸臆，表达爱雨之情。"]]},vocab:[["花苞","huā bāo","尚未开放的花朵。","flower bud"],["娇媚","jiāo mèi","妩媚动人。","charming"],["棱镜","léng jìng","能折射光线的透明光学器件。","prism"],["粗犷","cū guǎng","粗豪豪放。","bold"],["静谧","jìng mì","安静。","tranquil"],["高邈","gāo miǎo","高而远。","lofty"],["莅临","lì lín","来到，多用于书面语。","visit"],["吝啬","lìn sè","过分爱惜财物。","stingy"],["淅淅沥沥","xī xī lì lì","形容轻微的风声、雨声。","pattering"],["干涩","gān sè","干燥滞涩。","dry"],["咄咄逼人","duō duō bī rén","形容气势汹汹、盛气凌人。","aggressive"],["草垛","cǎo duò","堆积成垛的草。","haystack"]],focusVocab:[["静谧","安静。多用于形容环境、夜色或气氛。","秋天的雨，似乎比春天、夏天、冬天更能使人静谧、使人怀想。","“静谧”比“安静”更有书面语色彩，常写宁静的环境。"],["高邈","高而远。","远远地望过去，收割过的田野变得很亮。","可联系“高远”理解，属于书面词语。"],["吝啬","过分爱惜财物，不舍得给别人或自己使用。","那是雨，是使人静谧、使人怀想、使人动情的秋雨啊！","课文把雨拟人化，相关语境中要体会作者赋予自然景物的性格。"],["淅淅沥沥","形容轻微的风声、雨声。","雨，似乎也像出嫁生了孩子的母亲，显得端庄、沉静。","常用来描写细雨连续落下的声音。"],["咄咄逼人","形容气势汹汹、盛气凌人。","春天，像刚落地的娃娃，从头到脚都是新的，它生长着。","注意词语通常含有较强的负面评价，不能随意用于赞美温和景物。"]],qs:[{q:"本文组织材料的主要线索是什么？",a:["一天中的时间变化","四季更替及各季节雨的特点","作者旅行的地点变化"],correct:1,why:"文章以春、夏、秋、冬四季为序，分别描写不同季节的雨。"}]},
{title:"4 古代诗歌四首",author:"曹操、王湾、李白、马致远",type:"古代诗歌",intro:"本课包括《观沧海》《次北固山下》《闻王昌龄左迁龙标遥有此寄》《天净沙·秋思》，从不同角度呈现自然景物、人生感受与诗人情怀。",focus:["理解诗歌意象与诗人情感之间的关系。","掌握借景抒情、虚实结合等常见表现手法。","熟读并背诵，注意节奏、韵律和关键名句。"],words:"沧海、竦峙、萧瑟、潮平、风正、杨花、子规、龙标、断肠",method:"意象分析；借景抒情；炼字赏析；诵读积累。",structure:{"thesis":"四首诗歌分别写大海景象、旅途风光、友人远谪和游子秋思，借助鲜明意象表达诗人的胸襟、思乡怀人之情与羁旅愁思。","parts":[["《观沧海》·曹操","登临碣石，描写水波、山岛、草木、秋风和洪波，再以日月星汉的宏阔想象表现博大胸襟与远大抱负。"],["《次北固山下》·王湾","描写青山绿水、潮平风正和海日江春，表达羁旅思乡；“海日生残夜，江春入旧年”蕴含新旧交替的哲理。"],["《闻王昌龄左迁龙标遥有此寄》·李白","由杨花、子规点明时令与凄清氛围，借明月寄托对被贬友人的关切和思念。"],["《天净沙·秋思》·马致远","用枯藤、老树、昏鸦、小桥、流水、人家、古道、西风、瘦马等意象组合成深秋图景，表现游子孤独悲愁。"]]},vocab:[["沧海","cāng hǎi","大海。","the sea"],["澹澹","dàn dàn","水波荡漾的样子。","rippling"],["竦峙","sǒng zhì","耸立。","stand tall"],["萧瑟","xiāo sè","形容风吹树木的声音；常表现冷落、凄凉。","bleak"],["次","cì","停宿；旅途中暂时停留。","stay"],["客路","kè lù","旅人前行的路。","traveler's road"],["左迁","zuǒ qiān","降职。","demotion"],["子规","zǐ guī","杜鹃鸟。","cuckoo"],["昏鸦","hūn yā","黄昏时将要回巢的乌鸦。","crows at dusk"],["断肠","duàn cháng","形容悲伤到极点。","heartbroken"],["天涯","tiān yá","天边；指远离家乡的地方。","faraway place"]],focusVocab:[["澹澹","水波荡漾的样子。","水何澹澹，山岛竦峙。","通过水波动态与山岛静态相结合，表现大海的辽阔与壮观。"],["竦峙","高高地挺立。","水何澹澹，山岛竦峙。","“竦”有耸立之意，“峙”指直立；写出山岛巍然屹立的姿态。"],["客路","旅人前行的道路，也暗含羁旅在外。","客路青山外，行舟绿水前。","赏析时要联系诗人的行旅身份和后文的思乡之情。"],["乡书","家书，寄给家人的书信。","乡书何处达？归雁洛阳边。","“乡书”点出思乡主题；诗人借归雁传递家书的愿望。"],["左迁","降职。古人以右为尊，故称降职为左迁。","闻王昌龄左迁龙标遥有此寄。","标题交代友人遭贬及写诗缘由，理解“左迁”有助于把握诗歌情感。"],["断肠","形容悲伤到极点。","夕阳西下，断肠人在天涯。","结尾点明游子极度思乡、悲愁的心境。"]],qs:[{q:"《天净沙·秋思》中最能直接点明游子内心愁苦的句子是？",a:["枯藤老树昏鸦","小桥流水人家","断肠人在天涯"],correct:2,why:"“断肠人在天涯”直抒胸臆，点明羁旅愁思。"}]}]},
{title:"第二单元：至爱亲情",desc:"学习朗读，整体感知课文内容，把握作者的思想感情。",lessons:[
{title:"5 秋天的怀念",author:"史铁生",type:"现代文阅读",intro:"文章回忆作者在双腿瘫痪后与母亲相处的经历，通过母亲隐忍的关怀、反复的叮嘱以及对菊花的牵挂，表现深沉的母爱，也写出作者对母亲的理解、怀念与愧疚。",focus:["梳理“我”的情绪变化和母亲的言行，理解人物形象。","关注反复出现的细节、对话和景物描写，体会其作用。","理解“好好儿活”等语句的深层含义，体会文章情感。"],words:"瘫痪、暴怒、沉寂、侍弄、捶打、憔悴、央求、絮叨、诀别、烂漫",method:"通过人物语言、动作和神态刻画人物；细节描写；借景物变化烘托情感；以反复照应深化主题。",structure:{"thesis":"文章回忆母亲在“我”双腿瘫痪后给予的关怀，以及母亲去世后“我”对她的怀念与理解，表达对母爱的深切感念，也传递珍爱生命、坚强生活的信念。","parts":[["第一部分·暴怒与隐忍","写“我”瘫痪后的暴怒无常，以及母亲小心翼翼地照料、劝慰。"],["第二部分·央求看花","写母亲病重仍努力劝“我”去北海看菊花，表现她对儿子的牵挂。"],["第三部分·永远的诀别","写母亲突然病逝，“我”得知真相后的震惊与悲痛。"],["第四部分·懂得好好儿活","妹妹陪“我”去看菊花，“我”理解母亲未说完的话，决心珍惜生命。"]]},vocab:[["瘫痪","tān huàn","身体某部分或全部丧失运动功能。","paralysis"],["暴怒","bào nù","突然猛烈地发怒。","rage; fury"],["沉寂","chén jì","十分寂静。","silence; stillness"],["侍弄","shì nòng","（方言）经营照管，如照料花草。","tend; look after"],["捶打","chuí dǎ","用拳头或器物反复敲打。","beat; pound"],["憔悴","qiáo cuì","形容人瘦弱，面色不好。","haggard; emaciated"],["央求","yāng qiú","恳切地请求。","implore; plead"],["絮叨","xù dao","来回地说，絮絮叨叨。","chatter; ramble"],["诀别","jué bié","分别（多指不易再见的离别）。","part forever; say a final farewell"],["淡雅","dàn yǎ","素净雅致。","simple and elegant"],["高洁","gāo jié","高尚纯洁。","noble and pure"],["烂漫","làn màn","颜色鲜明而美丽；文中形容菊花盛开、色彩绚丽。","bright and colorful; in full bloom"],["翻来覆去","fān lái fù qù","来回翻身；也形容一次又一次。","toss and turn; over and over"],["喜出望外","xǐ chū wàng wài","遇到出乎意料的喜事而特别高兴。","overjoyed; delighted beyond expectation"]],focusVocab:[["暴怒无常","形容脾气非常暴躁，变化不定。","他发起脾气来就像一阵风，来得快，去得也快。","分析人物时要联系史铁生因病苦闷、情绪失控的处境。"],["侍弄","经营照管（庄稼、花草等）。","母亲就悄悄地躲出去，在我看不见的地方偷偷地听着我的动静。","常与花草、园地搭配，如“侍弄花草”。"],["絮絮叨叨","形容说话啰嗦、反复。","母亲就像个孩子似的，东问西问。","课文中的相关描写体现母亲对儿子的牵挂，不宜简单理解为嫌烦。"],["敏感","生理或心理上对外界事物反应很快。","她又悄悄地出去了。","结合上下文理解人物对疾病、生活变化的情绪反应。"],["喜出望外","遇到出乎意料的好事而特别高兴。","我的回答已经让她喜出望外了。","“望”是希望、意料；注意与“欣喜若狂”辨析，语气程度不完全相同。"]],qs:[{q:"母亲反复央求“我”去看花，主要体现了她怎样的心愿？",a:["希望借看花转移“我”的注意力，帮助“我”重新感受生活","希望“我”独自外出，不再需要她照顾","只是为了完成一次普通的家庭活动"],correct:0,why:"母亲希望通过看花唤起儿子对生活的兴趣和信心，体现她深沉而克制的爱。"},{q:"文中多次提到菊花，其重要作用是什么？",a:["只为交代故事发生的季节","作为贯穿全文的线索，寄托对生命与母爱的理解","说明母亲最喜欢园艺"],correct:1,why:"菊花与秋天、母亲的叮嘱及结尾的回忆相联系，承载着珍惜生命、坚强生活的意味。"}]},
{title:"6 散步",author:"莫怀戚",type:"现代文阅读",intro:"文章记叙一家人在田野散步时发生的分歧，展现祖孙三代之间的理解、体谅与责任，表现家庭成员之间温暖的亲情。",focus:["概括散步过程中的事件与矛盾。","理解“我”作出选择时体现的责任意识。","体会文章以小见大的叙事特点和语言节奏。"],words:"分歧、信服、霎时、拆散、委屈、粼粼、各得其所",method:"以小见大；对称句式；细节描写；叙事中融入抒情与议论。",structure:{"thesis":"文章记叙一家四口在初春田野散步时发生的路线分歧，表现祖孙三代互相体谅、彼此关爱，赞美家庭亲情和中年一代承前启后的责任感。","parts":[["交代人物与缘由","一家四口在田野散步，母亲起初不愿出门，“我”劝她多走走。"],["描写初春田野","描写新绿、嫩芽和冬水，点出春天与生命的气息。"],["路线发生分歧","母亲想走大路，儿子想走小路，选择落在“我”身上。"],["作出选择与转折","“我”决定走大路，母亲又改变主意，愿意走小路。"],["背起责任与亲情","“我”和妻子分别背起母亲与儿子，稳稳地走向前方，升华主题。"]]},vocab:[["信服","xìn fú","相信并佩服。","be convinced"],["分歧","fēn qí","意见不一致。","difference of opinion"],["取决","qǔ jué","由某方面或某种情况决定。","depend on"],["一霎时","yí shà shí","极短的时间。","in an instant"],["委屈","wěi qu","受到不应有的指责或待遇，心里难过。","feel wronged"],["粼粼","lín lín","形容水、石等明净。","shimmering"],["各得其所","gè dé qí suǒ","每个人或事物都得到合适的安排。","each in the right place"]],focusVocab:[["信服","相信并佩服。","她信服地点点头，便去拿外套。","“信服”比“相信”多了佩服、认可的意味。"],["分歧","意见不一致。","后来发生了分歧：母亲要走大路，大路平顺；我的儿子要走小路，小路有意思。","文章中的分歧推动情节发展，也呈现不同家庭成员的需求。"],["一霎时","极短的时间。","一霎时，我感到了责任的重大。","常用来表现某种感受或变化在极短时间内发生。"],["各得其所","每个人或事物都得到合适的安排。","这样，大家都满意。","理解时要关注“各”和“所”：每一个人都处在适合自己的位置或得到恰当安排。"]],qs:[{q:"散步过程中产生分歧，最终由“我”决定走大路，体现了什么？",a:["“我”只考虑自己的方便","“我”承担起协调家庭关系的责任","家庭成员之间无法沟通"],correct:1,why:"“我”既要照顾母亲，也要顾及孩子，体现中年一代承前启后的责任。"}]},
{title:"7* 散文诗二首",author:"泰戈尔、冰心",type:"自读课文",intro:"《金色花》借孩子化作金色花与母亲嬉戏的想象，表现亲子之间的依恋；《荷叶·母亲》借荷叶庇护红莲的情景，赞美母爱的无私与伟大。",focus:["理解两篇作品的主要意象及其象征意味。","比较儿童视角与抒情视角的表达特点。","体会想象、比喻和象征在抒情散文诗中的作用。"],words:"匿笑、祷告、沐浴、荫蔽、徘徊、遮蔽、菡萏、欹斜",method:"丰富的想象；象征与比喻；借具体形象表达抽象情感。",structure:{"thesis":"《金色花》通过儿童变成金色花与母亲嬉戏的想象，表达孩子对母亲的依恋；《荷叶·母亲》由雨中荷叶保护红莲联想到母亲庇护子女，赞颂母爱的无私与伟大。","parts":[["《金色花》·想象起笔","“我”想象自己变成金色花，在母亲工作、祷告、读书时悄悄陪伴她。"],["《金色花》·亲子互动","孩子以躲藏和不告知身份的方式与母亲嬉戏，表现天真、调皮和依恋。"],["《荷叶·母亲》·由莲入情","由眼前红莲、白莲和往事写起，雨打红莲使作者心绪不宁。"],["《荷叶·母亲》·托物抒情","大荷叶倾侧覆盖红莲，作者由此联想到母亲对自己的庇护，点明主题。"]]},vocab:[["匿笑","nì xiào","偷偷地笑。","smile secretly"],["祷告","dǎo gào","向神祈求保佑。","pray"],["沐浴","mù yù","洗澡；也比喻受到润泽。","bathe"],["荫蔽","yīn bì","（枝叶）遮蔽；也指庇护。","shelter; shade"],["徘徊","pái huái","在一个地方来回走动。","pace back and forth"],["菡萏","hàn dàn","荷花的别称，课文中指含苞未放的红莲。","lotus bud"],["欹斜","qī xié","倾斜、歪斜。","tilted"],["慈怜","cí lián","慈爱怜惜。","tender compassion"]],focusVocab:[["匿笑","偷偷地笑。","我暗暗地在那里匿笑，却一声儿不响。","“匿”有隐藏之意，写出孩子调皮、天真的心理。"],["祷告","向神祈求保佑。","当你沐浴后，湿发披在两肩，穿过金色花的林阴。","理解宗教文化背景词语时，结合课文情境即可，不必过度引申。"],["荫蔽","（枝叶）遮蔽；也指庇护。","那勇敢慈怜的荷叶上，聚了些流转无力的水珠。","在《荷叶·母亲》中，荷叶为红莲遮挡风雨，具有象征意义。"],["菡萏","荷花的别称，常指含苞待放的荷花。","半夜里听见繁杂的雨声，早起是浓阴的天。","属于古典书面词汇，阅读时能辨认并理解即可。"],["欹斜","倾斜、歪斜。","一回头忽然看见红莲旁边一个大荷叶，慢慢地倾侧了来。","注意它描写的是姿态，为理解荷叶遮护红莲的动作服务。"]],qs:[{q:"《荷叶·母亲》中，荷叶与红莲的关系主要象征什么？",a:["自然界中普通的植物关系","母亲保护、关爱子女的情景","人与自然之间的冲突"],correct:1,why:"荷叶为红莲遮挡风雨，作者由此联想到母亲对孩子的庇护。"}]},
{title:"8《世说新语》二则",author:"刘义庆（编）",type:"文言文",intro:"《咏雪》写谢家子弟咏雪的故事，表现人物的才思与语言之美；《陈太丘与友期行》通过友人与陈元方的对话，表现诚信、礼貌与明辨是非。",focus:["借助注释疏通文意，积累常见文言词语。","理解人物对话，分析人物形象。","学习用简洁语言表现人物特点的写法。"],words:"内集、儿女、俄而、骤、差可拟、期行、舍去、乃、尊君、家君、引",method:"文言词语积累；结合语境理解句意；通过对话表现人物性格。",structure:{"thesis":"《咏雪》通过谢家子弟即景咏雪的故事，表现谢道韫的才思敏捷；《陈太丘与友期行》通过陈元方与友人的对话，表现陈元方明礼诚信、坚持原则的品格。","parts":[["《咏雪》·家庭聚会","寒雪日谢太傅与家中子弟讲论文义，忽然大雪，谢安提出“白雪纷纷何所似”。"],["《咏雪》·比喻争论","谢朗以“撒盐空中”比雪，谢道韫以“柳絮因风起”比雪，谢安大笑，故事表现咏雪才思。"],["《陈太丘与友期行》·友人失约","友人约定正午同行却过时未到，陈太丘离开，友人后来才到。"],["《陈太丘与友期行》·元方明理","友人责骂陈太丘，元方指出失约是无信、对子骂父是无礼；友人惭愧，元方入门不顾。"]]},vocab:[["内集","nèi jí","把家里人聚集在一起。","gather the family"],["儿女","ér nǚ","这里泛指家里的小辈，包括侄儿侄女。","children and younger generation"],["俄而","é ér","不久，一会儿。","soon"],["骤","zhòu","急。","sudden"],["欣然","xīn rán","高兴的样子。","gladly"],["差可拟","chā kě nǐ","大体可以相比。","roughly comparable"],["未若","wèi ruò","不如，不及。","not as good as"],["因风","yīn fēng","乘风；趁着风势。","with the wind"],["期行","qī xíng","相约同行；期，约定。","agree to travel together"],["日中","rì zhōng","正午时分。","noon"],["舍去","shě qù","丢下（他）而离开。","leave behind"],["乃","nǎi","才。","only then"],["尊君","zūn jūn","对别人父亲的尊称。","your respected father"],["不","fǒu","同“否”，表示疑问。","question particle"],["相委而去","xiāng wěi ér qù","丢下我走了；委，丢下。","leave someone behind"],["家君","jiā jūn","对人谦称自己的父亲。","my father"],["引","yǐn","拉。","pull"],["顾","gù","回头看。","turn around and look"]],focusVocab:[["俄而","不久，一会儿。","俄而雪骤。","文言时间词，表示事情发生得很快。"],["差可拟","大体可以相比。","撒盐空中差可拟。","“差”是大体、略微，“拟”是相比；整句意为大体可以相比。"],["未若","不如，不及。","未若柳絮因风起。","用于比较两种说法，谢道韫认为柳絮随风飞舞更像雪。"],["期行","相约同行。","陈太丘与友期行。","“期”在这里是约定，不是现代汉语中的“日期”或“期望”。"],["尊君／家君","“尊君”是对别人父亲的尊称；“家君”是对自己父亲的谦称。","尊君在不？——待君久不至，已去。","文言交际称谓要分清说话对象：尊君敬称对方父亲，家君谦称自己的父亲。"],["相委而去","丢下我就离开了；“委”是丢下、舍弃。","友人便怒曰：“非人哉！与人期行，相委而去。”","结合上下文理解，陈元方批评友人失约，强调诚信。"]],qs:[{q:"《陈太丘与友期行》中，友人“下车引之”的原因最恰当的是？",a:["认为自己已经完全正确","意识到自己失信且言语失礼，想向元方表示歉意","想带元方一起离开"],correct:1,why:"友人先失约又对子骂父，听到元方的批评后感到惭愧，因而下车拉元方。"}]}]}
,{title:"第三单元：学习生活与成长",desc:"围绕学习生活与成长经历展开阅读，练习默读、梳理文章中心，并学习如何突出中心。",extras:[["写作训练：如何突出中心","明确中心，围绕中心选择材料；合理安排详略与顺序；可用开门见山、篇末点题、铺垫、呼应、对比等方式突出中心。"],["整本书阅读：《朝花夕拾》","了解鲁迅从童年到青年时期的生活经历；结合阅读目的灵活运用精读、略读和浏览。"],["单元阅读方法","默读时集中注意力，尽量连续读完；借助标题、开头、结尾和关键语句梳理内容、概括中心。"],["语言积累","学习同义词与近义词的辨析，关注词义轻重、搭配范围、感情色彩和语体差异。"]],lessons:[
{title:"9 从百草园到三味书屋",author:"鲁迅",type:"现代文阅读",intro:"文章回忆童年在百草园的自由快乐，以及进入三味书屋后的读书生活。作者通过景物、活动、传说和私塾生活的对照，表现童年经验的丰富，也流露对童年生活的留恋。",focus:["梳理百草园与三味书屋两部分的内容。","品味景物描写中准确、生动的词语，体会多感官描写的作用。","结合事件分析童年生活的趣味，以及作者对私塾生活的复杂感受。"],words:"确凿、轻捷、臃肿、攒、机关、鉴赏、人迹罕至、觅食、渊博、宿儒、方正、质朴",method:"多感官描写；对比；详略安排；从儿童视角体会情趣。",structure:{thesis:"文章回忆百草园的童年乐趣和三味书屋的读书生活，表现童年生活的丰富多彩，表达对百草园生活的留恋。",parts:[["百草园","描写菜畦、树木、昆虫、鸟雀和植物，展现生机勃勃的自然世界。"],["美女蛇的传说","插入长妈妈讲述的故事，增添神秘色彩，也反映儿童的好奇与想象。"],["冬日捕鸟","细致描写捕鸟过程，表现儿童观察、尝试和游戏的乐趣。"],["告别百草园","以依依惜别的语气转入三味书屋。"],["三味书屋","写拜师、询问“怪哉”、读书和课间活动，呈现私塾生活的规矩与童趣。"]]},vocab:[["确凿","què záo","确实。","certain; definite"],["轻捷","qīng jié","轻快敏捷。","nimble; agile"],["攒","cuán","聚拢、凑在一起。","gather; collect"],["机关","jī guān","这里指秘密或奥妙。","secret; trick"],["鉴赏","jiàn shǎng","鉴定和欣赏。","appreciate"],["人迹罕至","rén jì hǎn zhì","少有人到的地方。","rarely visited"],["觅食","mì shí","寻找食物。","forage"],["渊博","yuān bó","学识深而且广。","erudite"],["宿儒","sù rú","年高而学问深厚的儒者。","learned senior scholar"],["方正","fāng zhèng","品行端正。","upright"],["质朴","zhì pǔ","朴实、不矫饰。","simple; unpretentious"]],focusVocab:[["确凿","确实；真实可靠，常用于判断事实或证据。","调查记录显示，这些数据确凿可靠。","“确凿”强调真实可靠，“确切”强调准确恰当。"],["轻捷","轻快敏捷，多用于描写动作、身姿。","小猫轻捷地跃上窗台。","“轻”突出动作轻巧，“捷”突出迅速灵活。"],["攒","聚拢、凑在一起；读 cuán。","孩子们把彩色纸片攒在一起，做成拼贴画。","注意多音字：“攒”还读 zǎn，表示积蓄，如“积攒”。"],["人迹罕至","很少有人到达，常形容偏僻或少有人活动的地方。","这片山谷人迹罕至，保留着原始风貌。","“罕”是稀少；不要误写成“人迹罕致”。"],["渊博","学识深厚、广博，常形容知识或学问。","王老师知识渊博，回答问题总能旁征博引。","多用于形容人的学识。"]],qs:[{q:"文章为什么先写百草园，再写三味书屋？",a:["按地点转换回忆童年生活，形成前后对照","为了说明两个地方距离很远","为了按季节顺序介绍绍兴风景"],correct:0,why:"两个地点对应不同的生活体验，结构转换体现童年生活从自由玩乐到入塾读书的变化。"},{q:"百草园部分最突出的表达特点是什么？",a:["集中使用抽象议论","调动多种感官，描写自然景物和活动","只通过人物对话推动情节"],correct:1,why:"作者写颜色、声音、触感和活动，使百草园成为具体可感的童年乐园。"}]},
{title:"10 往事依依",author:"于漪",type:"现代文阅读",intro:"作者回忆少年时代读书、观画、赏景和听课的经历，写出优秀读物与老师的教学如何滋养心灵、培养兴趣，表达对往事的怀念以及对读书和教育的珍视。",focus:["默读课文，找出领起段落和串联回忆的关键语句。","梳理作者重点回忆的几件往事，理解它们对成长的意义。","品味富有表现力的词语，体会读书经历对人的影响。"],words:"徜徉、浩淼、雕镂、心旷神怡、眼花缭乱、津津有味、搜索枯肠、谆谆教导",method:"抓领起句和关键语句；围绕主题组织回忆；叙事与抒情结合。",structure:{thesis:"作者回忆少年时代阅读诗歌、欣赏自然和聆听老师讲课的经历，表达对美好往事的怀念，并强调读书与优秀教师对人成长的深远影响。",parts:[["读《千家诗》的乐趣","回忆诵读诗歌、感受四季风光的经历，表现文学阅读带来的美感。"],["诗歌与自然","写诗句如何唤起丰富的想象，让作者沉浸于美的享受。"],["老师入情入理的讲课","回忆国文老师朗诵诗词、感染学生的情景。"],["课外阅读的影响","写老师鼓励多读好书，说明阅读开阔眼界、丰富知识。"],["结尾","总结回忆的意义，表达珍惜往事、不断奋进的情感。"]]},vocab:[["徜徉","cháng yáng","闲游、安闲自在地步行。","wander; stroll"],["浩淼","hào miǎo","水面广阔。","vast; boundless"],["雕镂","diāo lòu","雕刻。","carve; engrave"],["心旷神怡","xīn kuàng shén yí","心情舒畅，精神愉快。","relaxed and delighted"],["眼花缭乱","yǎn huā liáo luàn","看见复杂纷繁的东西而感到迷乱。","dazzled"],["津津有味","jīn jīn yǒu wèi","形容趣味很浓。","with great interest"],["搜索枯肠","sōu suǒ kū cháng","形容竭力思索。","rack one's brains"],["谆谆教导","zhūn zhūn jiào dǎo","恳切、耐心地教导。","earnest instruction"]],focusVocab:[["徜徉","闲游、安闲自在地行走，也可比喻沉浸在某种境界中。","周末，我们在湖边徜徉，欣赏初春的景色。","常与“书海、艺术、知识”等搭配，表示沉浸其中。"],["浩淼","形容水面辽阔、无边无际。","站在山顶远望，湖面浩淼，水天相接。","多用于描写水域广阔，书面语色彩较强。"],["雕镂","雕刻；也可比喻细致地刻画。","这段经历在他的记忆中留下了深刻印记。","比“雕刻”更具书面色彩和文学意味。"],["心旷神怡","心境开阔，精神愉快。","雨后登高远眺，清新的空气令人心旷神怡。","“旷”指开阔；“怡”指愉快。"],["谆谆教导","恳切、耐心地教诲指导。","老师的谆谆教导，让我懂得了坚持的重要性。","通常用于长辈、老师对晚辈或学生的耐心教诲。"]],qs:[{q:"作者回忆少年时代的读书经历，重点表现了什么？",a:["阅读与老师的引导对兴趣、情感和成长的影响","少年时代生活条件的艰苦","不同学校之间的教学设施差异"],correct:0,why:"文章通过诗歌阅读和老师讲课等往事，表现文学与教育对精神成长的滋养。"},{q:"理解文章结构，最有效的方法是什么？",a:["只按每段字数划分层次","抓住领起句、关键语句和结尾，梳理回忆之间的关系","只统计文中出现的人名"],correct:1,why:"关键语句能帮助读者把握内容层次和文章中心。"}]},
{title:"11 再塑生命的人",author:"海伦·凯勒",type:"现代文阅读",intro:"文章回忆莎莉文老师到来后对“我”的教育。老师通过耐心、具体的教学，让“我”理解词语与事物之间的联系，尤其是“水”这一词的意义，从而打开认识世界的大门。",focus:["梳理莎莉文老师到来前后“我”的生活与心理变化。","抓住“水”等关键事件，理解语言启蒙的意义。","体会叙事中穿插心理感受的表达方式，分析莎莉文老师的教育艺术。"],words:"攫、茫然、企盼、启示、惭愧、悔恨、激荡、疲倦",method:"抓住关键事件；关注开头、结尾和点题句；分析人物动作与心理变化。",structure:{thesis:"文章通过回忆莎莉文老师教“我”认识事物、理解语言的过程，表现老师的耐心与爱心，赞美教育带来的启蒙力量。",parts:[["老师到来","交代莎莉文老师到来前后生活状态的巨大差异。"],["学习拼写词语","从“娃娃”等词开始，写“我”逐步接触语言，却尚未真正理解词义。"],["水与水杯的争执","写“我”因不能区分词语而烦躁，表现启蒙过程中的困难。"],["水井房的顿悟","老师把水流与手指拼写结合起来，“我”突然理解“水”的意义。"],["新的生命体验","“我”开始渴望学习，理解更多词语，也第一次感受到深层情感。"]]},vocab:[["攫","jué","抓取。","seize; grab"],["茫然","máng rán","完全不知道或不知所措的样子。","at a loss"],["企盼","qǐ pàn","盼望。","look forward to"],["启示","qǐ shì","启发指示，使有所领悟。","enlightenment"],["惭愧","cán kuì","因有缺点、错误或未能尽责而感到不安。","ashamed"],["悔恨","huǐ hèn","懊悔、痛恨自己的过错。","remorse"],["激荡","jī dàng","动荡；也形容情绪强烈起伏。","surge; stir"],["疲倦","pí juàn","疲乏、困倦。","tired; weary"]],focusVocab:[["茫然","完全不知道或不知所措的样子。","面对陌生的任务，他一时感到茫然。","常用来描写心理状态。"],["企盼","盼望，通常带有较强的期待意味。","孩子站在门口，企盼远方的父亲早日回家。","含有殷切期待的感情色彩。"],["启示","启发指示，使人有所领悟；也指从中获得的道理。","这次经历给了我重要的启示：遇到困难要先冷静分析。","可作名词或动词使用。"],["悔恨","因自己的错误或过失而懊悔、痛恨。","他为当时没有认真听取劝告而感到悔恨。","比“后悔”语气更重，常包含深刻自责。"],["激荡","受到冲击而动荡；也可形容情绪、思想强烈起伏。","听到熟悉的旋律，他的心中涌起激荡的情感。","常与“心潮、情感、思想”等搭配。"]],qs:[{q:"莎莉文老师教“我”理解“水”这个词，关键方法是什么？",a:["只让“我”反复背诵字母","把真实的水流体验与手指拼写结合起来","直接告诉“我”所有词语的定义"],correct:1,why:"触觉经验与语言符号同时出现，使“我”真正理解词语所指的事物。"},{q:"“水”这一顿悟对“我”意味着什么？",a:["只是记住一个新单词","开始理解语言与事物的联系，认识世界的能力被打开","从此不再需要老师帮助"],correct:1,why:"理解“水”是语言启蒙的关键时刻，标志着“我”开始借助语言认识世界。"}]},
{title:"12 《论语》十二章",author:"孔子及其弟子",type:"文言文",intro:"课文选取《论语》中的十二则语录，内容涉及学习方法、学习态度、个人修养和人生境界。语言简洁凝练，许多语句已成为广为流传的格言和成语。",focus:["借助注释疏通文意，掌握重点文言实词、虚词和通假字。","理解孔子及其弟子关于学习、修身和为人的观点。","熟读背诵，体会语录体语言简洁、节奏鲜明的特点。"],words:"时习、愠、三省、信、传、立、惑、逾矩、温故知新、罔、殆、箪、堪、笃志",method:"结合注释理解文言词义；联系语境辨析词义；划分节奏；归纳观点并联系生活。",structure:{thesis:"十二章语录从学习方法、学习态度、修身做人和志向追求等方面阐述儒家思想，强调勤学善思、虚心求教、诚信自省、坚守志向。",parts:[["学习与交友","强调学习后按时温习的快乐，以及朋友远道而来的喜悦。"],["自我反省与诚信","提出反省自己，检查待人、交友和学习是否诚实认真。"],["人生阶段与温故知新","谈个人成长境界，并指出温习旧知可以获得新的理解。"],["学思关系与学习兴趣","强调学习与思考不可偏废，并指出兴趣和热爱能提升学习效果。"],["安贫乐道与择善而从","表现颜回安于简朴、乐于求道的品格，提倡向他人优点学习。"],["珍惜时间与坚守志向","以流水比喻时间流逝，强调志向不可轻易改变。"],["博学笃志","强调广泛学习、坚定志向、恳切求教和联系实际思考。"]]},vocab:[["时习","shí xí","按时温习。","review regularly"],["愠","yùn","生气、恼怒。","be annoyed"],["三省","sān xǐng","多次进行自我检查。","examine oneself"],["信","xìn","诚信。","trustworthiness"],["传","chuán","老师传授的知识。","teachings"],["立","lì","立身，指能有所成就。","establish oneself"],["惑","huò","迷惑、疑惑。","confused"],["逾矩","yú jǔ","越过法度。","go beyond rules"],["温故知新","wēn gù zhī xīn","温习学过的知识，得到新的理解和体会。","review the old and learn the new"],["罔","wǎng","迷惑，感到迷茫而无所适从。","be puzzled"],["殆","dài","疑惑。","be in doubt"],["箪","dān","古代盛饭用的圆形竹器。","bamboo food container"],["堪","kān","能忍受。","endure"],["笃志","dǔ zhì","坚定志向。","be committed to one's aims"]],focusVocab:[["时习","按时温习。“时”在这里是按时、适时。","学完一课后及时复习，才能逐渐把知识掌握牢固。","理解文言词语要回到句子语境。"],["三省","多次反省自己。“三”在这里可理解为多次。","每天结束学习后，他都会反省当天的时间安排是否合理。","古汉语数字有时表示概数，不一定是精确的三次。"],["温故知新","温习旧知识，从中获得新的理解和体会。","定期整理错题，常常能温故知新，发现以前忽略的规律。","不仅是重复记忆，还强调在复习中产生新的认识。"],["罔／殆","“罔”指迷惑而无所适从；“殆”指疑惑。","只记结论不思考，容易感到迷茫；只空想不学习，也难以真正弄懂。","两字分别对应学而不思、思而不学的后果。"],["笃志","坚定志向，专心致力于目标。","他笃志钻研古典文学，长期积累资料和阅读笔记。","“笃”有坚定、专一之意，常与“笃学、笃行”组成书面表达。"]],qs:[{q:"“学而不思则罔，思而不学则殆”强调什么？",a:["学习只需要记忆","学习与思考应结合，不能偏废","思考比学习更重要，可以不读书"],correct:1,why:"只学习不思考会迷惑，只思考不学习会疑惑，强调学思结合。"},{q:"“温故而知新”中的“温故”指什么？",a:["温习学过的知识","回忆童年往事","学习全新的知识"],correct:0,why:"“故”指旧知识；温习旧知识并获得新理解，是这句话的核心意思。"},{q:"“三军可夺帅也，匹夫不可夺志也”主要强调什么？",a:["军队人数决定一切","个人应坚守自己的志向和信念","普通人不需要学习"],correct:1,why:"语句突出个人志向和信念的重要性。"}]}
]}

{title:"第四单元：人生与理想",desc:"阅读人物事迹与古代家训，体会理想信念、责任担当和勤勉修身；学习梳理文章思路，形成清晰的写作提纲。",extras:[["写作训练：思路要清晰","写作前先明确中心、筛选材料；根据文体和内容确定时间、空间或逻辑顺序；列提纲，安排层次、详略与过渡。"],["专题学习：少年正是读书时","关注阅读兴趣、阅读习惯和阅读方法；学会从图表与文字资料中提取信息、归纳规律，并进行交流展示。"],["单元阅读方法","抓住关键语句把握段落主旨和文章层次；辨析词语的感情色彩，体会褒义词、贬义词和中性词在语境中的表达效果。"],["表达训练","练习用准确、恰当的词语表达情感态度；写人记事时兼顾事实叙述与观点表达。"]],lessons:[
{title:"13 纪念白求恩",author:"毛泽东",type:"议论文",intro:"文章叙述白求恩同志来华援助中国抗战并以身殉职的事迹，概括其国际主义精神、毫不利己专门利人的精神和对技术精益求精的态度，号召全党学习白求恩的高尚品德。",focus:["默读课文，归纳各段内容要点，理清段落之间的关系。","分析对比手法，理解白求恩与某些人的不同表现及其表达效果。","理解议论性语句的含义，学习夹叙夹议、层层深入的论证方式。"],words:"殉职、狭隘、热忱、拈轻怕重、漠不关心、麻木不仁、见异思迁、鄙薄、精益求精、纯粹",method:"夹叙夹议；对比论证；正面概括与反面批评结合；关键语句点明观点。",structure:{thesis:"文章赞扬白求恩同志的国际主义精神、毫不利己专门利人的精神和对技术精益求精的态度，号召全体党员学习他毫无自私自利之心、全心全意为人民服务的精神。",parts:[["第一段：国际主义精神","介绍白求恩来华援助中国抗战的经历，提出并阐释国际主义精神。"],["第二段：毫不利己专门利人的精神","从对工作、对同志和人民的态度两方面进行正反对比，突出白求恩的无私与热忱。"],["第三段：对技术精益求精","写白求恩医术高明，以此批评见异思迁、鄙薄技术工作的人。"],["第四段：号召学习","叙述作者与白求恩的交往和悲痛之情，号召大家学习其精神，并概括做有益于人民的人应具备的品格。"]]},vocab:[["殉职","xùn zhí","为公务而牺牲生命。","die in the line of duty"],["狭隘","xiá ài","心胸、气量、见识等不宽广。","narrow-minded"],["热忱","rè chén","热情。","enthusiasm"],["拈轻怕重","niān qīng pà zhòng","接受工作时挑拣轻松的，害怕繁重的。","choose easy tasks and avoid hard ones"],["漠不关心","mò bù guān xīn","态度冷淡，毫不关心。","be indifferent"],["麻木不仁","má mù bù rén","原指肢体麻木、没有感觉；文中指缺乏热情。","apathetic; insensitive"],["见异思迁","jiàn yì sī qiān","看到别的事物就改变原来的主意；文中指不安心工作。","change one's mind constantly"],["鄙薄","bǐ bó","轻视。","look down upon"],["精益求精","jīng yì qiú jīng","已经很好了，还要求更好。","strive for perfection"],["纯粹","chún cuì","不掺杂别的成分；文中指品格纯正。","pure"],["低级趣味","dī jí qù wèi","庸俗、不高尚的兴趣爱好。","vulgar taste"]],focusVocab:[["殉职","为公务而牺牲生命。","那位消防员在救援行动中殉职。","通常用于公务、职务相关的牺牲，语体较正式。"],["拈轻怕重","接受任务时挑选轻松的，害怕繁重的。","团队合作不能拈轻怕重，重要任务需要共同承担。","带有明显贬义，批评逃避责任、挑活干的态度。"],["漠不关心","态度冷淡，丝毫不关心。","面对同学的困难，他没有漠不关心，而是主动伸出援手。","强调态度冷淡；与“毫不在意”相比，更突出对他人或事情缺乏关切。"],["见异思迁","看到别的事物就改变原来的主意；常指意志不坚定。","学习一门技能需要坚持，不能见异思迁。","含贬义；“迁”是改变。"],["精益求精","已经很好了，还要求更好。","这位工程师对每个细节都精益求精。","常用于工作、技术、学问等方面，强调持续改进。"],["纯粹","不掺杂别的成分；也可形容思想、品格纯正。","她帮助别人并非为了回报，而是出于纯粹的善意。","注意根据语境判断是“成分单一”还是“品格纯正”。"]],qs:[{q:"《纪念白求恩》第二段主要运用了哪种论证方法？",a:["举例论证和引用论证","对比论证","比喻论证"],correct:1,why:"文章将白求恩对工作、同志和人民的态度与某些人的表现进行对比，突出其高贵品质。"} ,{q:"文章最后一段列举“高尚的人、纯粹的人……”的作用是什么？",a:["从多个角度概括毫无自私自利之心的精神境界","介绍白求恩的医学技术","补充白求恩来华的时间"],correct:0,why:"排比式评价层层推进，强调学习白求恩精神的价值和意义。"}]},
{title:"14 回忆我的母亲",author:"朱德",type:"回忆性散文",intro:"作者回忆母亲勤劳的一生，叙写她在贫苦生活中的劳动、持家、待人和对子女的教育，赞颂母亲勤劳俭朴、宽厚仁慈、坚韧顽强的品格，并由个人怀念升华到对广大劳动人民的敬意。",focus:["梳理母亲一生的主要经历，归纳体现勤劳品格的具体事例。","分析记叙与议论相结合的表达方式，理解议论句的作用。","体会质朴平实的语言中蕴含的深厚情感。"],words:"佃农、客籍、劳碌、任劳任怨、周济、慰勉、不辍、节衣缩食、为富不仁",method:"以时间和事件组织材料；典型事例刻画人物；叙议结合；质朴语言表达深情。",structure:{thesis:"文章通过回忆母亲勤劳的一生，赞美她勤劳俭朴、宽厚仁慈、坚韧顽强的品格，表达作者对母亲的深切怀念和感激，并由此表达对广大劳动人民的敬意。",parts:[["开篇点题","交代得到母亲去世消息后的悲痛，点明回忆母亲勤劳一生。"],["母亲勤劳持家","写母亲承担繁重家务和农业劳动，善于持家，使贫苦家庭维持生活。"],["母亲的品格与家庭生活","写母亲任劳任怨、和蔼、同情贫苦者、节俭自律等品格。"],["家庭遭遇与思想启蒙","写灾荒、地主压迫等经历，以及母亲对作者反抗压迫、追求光明思想的影响。"],["母亲支持作者求学与革命","写母亲理解、支持作者离家求学和参加革命，虽长期分离仍惦念儿子。"],["母亲的影响与深情结尾","总结母亲给予自己的经验、身体和意志，表达报答母亲、服务民族和人民的决心。"]]},vocab:[["佃农","diàn nóng","旧时农村中自己不占有土地，以租种土地为生的农民。","tenant farmer"],["客籍","kè jí","寄居本地的外地人的身份。","non-native resident"],["劳碌","láo lù","事情多而辛苦。","toil; work hard"],["任劳任怨","rèn láo rèn yuàn","做事不辞劳苦，不怕别人埋怨。","work hard without complaint"],["周济","zhōu jì","对穷困的人给予物质帮助。","relieve; help the needy"],["慰勉","wèi miǎn","安慰并勉励。","console and encourage"],["不辍","bù chuò","不停止。","continue without stopping"],["节衣缩食","jié yī suō shí","省吃省穿，形容节俭。","live frugally"],["为富不仁","wéi fù bù rén","有钱而心狠，不讲仁义。","wealthy but cruel"],["勤俭","qín jiǎn","勤劳而节俭。","hardworking and thrifty"]],focusVocab:[["劳碌","事情多而辛苦。","奶奶一生劳碌，总把家人的需要放在前面。","常形容长期、持续的辛劳。"],["任劳任怨","做事不辞劳苦，也不怕受埋怨。","他任劳任怨地承担班级事务，从不计较个人得失。","强调既能吃苦，也不抱怨。"],["周济","对穷困的人给予物质帮助。","邻居家遇到困难时，村民们主动捐款周济。","多用于帮助经济上有困难的人，书面语色彩较强。"],["慰勉","安慰并勉励。","老师写信慰勉暂时受挫的学生。","由“安慰”和“勉励”两层意思构成。"],["不辍","不停止，常用于书面表达。","年过七旬的老人仍笔耕不辍。","常见搭配有“劳作不辍、笔耕不辍、学习不辍”。"],["节衣缩食","省吃省穿，形容生活十分节俭。","父母节衣缩食，供孩子完成学业。","多用于描述为了某个目标而尽力节省开支。"]],qs:[{q:"作者通过哪些方面表现母亲勤劳的品格？",a:["只写母亲对子女的言语关怀","写煮饭、种田、养蚕、纺棉、持家等多方面劳动","主要写母亲外出旅行的经历"],correct:1,why:"文章通过大量日常劳动和持家事例，具体呈现母亲勤劳能干的一生。"} ,{q:"文章结尾由怀念母亲转向对广大劳动人民的赞颂，作用是什么？",a:["使文章主题从个人亲情升华到对劳动人民的敬意与责任","与前文母亲形象无关","只是补充作者的家庭成员信息"],correct:0,why:"作者把母亲视为千百万劳动人民中的一员，表达继续为民族和人民服务的决心。"}]},
{title:"15* 梅岭三章",author:"陈毅",type:"现代诗歌",intro:"这组三首七言绝句写于革命者身处险境之时。诗人回顾艰苦的革命斗争，表达对牺牲战友的怀念、视死如归的豪情，以及坚信革命事业必将胜利的坚定信念。",focus:["结合小序了解组诗的写作背景，理解三首诗之间的内在联系。","品味“泉台”“旌旗”“烽烟”“自由花”等意象，体会诗人的情感。","理解借用典故、想象和象征等手法的表达效果。"],words:"丛莽、泉台、旌旗、阎罗、烽烟、捷报、取义成仁",method:"借助意象和典故理解诗意；把握三首诗的情感递进；诵读体会豪迈悲壮的语调。",structure:{thesis:"三首诗从面对牺牲的决心、对战友的期望，到对革命胜利的坚定信念层层推进，表现革命者视死如归、英勇战斗和追求自由解放的崇高理想。",parts:[["小序","交代梅山被围、身负重伤、担心无法脱险的写作背景。"],["第一章：面对牺牲","以设问开篇，写创业艰难，并想象牺牲后仍率领战友继续战斗。"],["第二章：期待捷报","回顾长期革命斗争，表达即使牺牲也要以胜利消息告慰自己的信念。"],["第三章：坚信胜利","写投身革命、为正义事业献身的决心，展望人间遍种自由之花的未来。"]]},vocab:[["丛莽","cóng mǎng","丛生的草木。","thick bushes"],["泉台","quán tái","指人死后埋葬的地方，也指阴间。","the underworld"],["旌旗","jīng qí","旗帜的总称；诗中借指军士。","banners; troops"],["阎罗","yán luó","民间传说中掌管阴间的神。","King of Hell"],["烽烟","fēng yān","古代报警的烟火，后泛指战火或战争。","smoke of war"],["捷报","jié bào","胜利的消息。","good news of victory"],["取义成仁","qǔ yì chéng rén","为成全仁义而不惜牺牲生命。","die for a righteous cause"]],focusVocab:[["泉台","指人死后埋葬的地方，也指阴间。","诗歌借“泉台”展开想象，表现诗人即使牺牲也不放弃战斗。","理解诗歌意象时，要注意它在具体语境中的象征意味。"],["旌旗","旗帜的总称；诗中借指军士或革命队伍。","节日广场上旌旗飘扬，气氛庄严热烈。","这里运用借代，以旗帜代指队伍。"],["烽烟","原指报警的烟火，后泛指战争。","历史的烽烟早已散去，和平生活更值得珍惜。","属于具有历史感的书面词语。"],["捷报","胜利的消息。","前线传来捷报，大家备受鼓舞。","常用于战争、比赛或重要任务取得胜利的消息。"],["取义成仁","为维护正义、成全仁德而不惜牺牲生命。","革命先辈以取义成仁的精神追求民族独立。","与“舍生取义”“杀身成仁”意义相近，具有崇高、庄严的感情色彩。"]],qs:[{q:"《梅岭三章》三首诗的情感脉络最恰当的是？",a:["由写景转为闲适生活，再转为个人得失","由面对牺牲的决心，到期待胜利捷报，再到坚信自由解放","由思乡之情转为儿女私情"],correct:1,why:"三首诗层层推进，表现革命者不惧牺牲、期待胜利、坚信理想实现的情感。"}]},
{title:"16 诫子书",author:"诸葛亮",type:"文言文",intro:"这封家书以简洁凝练的语言劝勉儿子修身养德、勤学立志。文章围绕“静”与“俭”展开，强调淡泊宁静、立志求学、珍惜时间，告诫后人不可放纵懈怠、轻薄浮躁。",focus:["借助注释疏通文意，掌握重点文言词语和句式。","梳理文章论述层次，理解修身、学习、立志之间的关系。","熟读背诵，体会整齐句式和对偶表达的韵律美。"],words:"夫、静、俭、淡泊、明志、致远、广才、淫慢、励精、险躁、治性、枯落",method:"文言实词积累；联系上下文推断词义；梳理论证层次；对偶句诵读。",structure:{thesis:"诸葛亮劝勉儿子以宁静专一修养身心，以节俭培养品德，通过学习增长才干、坚定志向，并警惕放纵懈怠和轻薄浮躁，以免虚度年华、一事无成。",parts:[["提出修身养德的原则","以“静以修身，俭以养德”提出修身的基本要求。"],["阐明淡泊与宁静的意义","指出不恬淡寡欲就无法明确志向，不宁静专一就无法达到远大目标。"],["论述学习与立志的关系","强调学习需要宁静，增长才干必须学习，学习成就又离不开坚定志向。"],["指出放纵浮躁的危害","说明放纵懈怠不能振奋精神，轻薄浮躁不能修养性情。"],["告诫珍惜时光","指出年华随时间流逝、意志随岁月消磨，最终可能衰残无用，悔之晚矣。"]]},vocab:[["淡泊","dàn bó","内心恬淡，不慕名利。","detached from fame and wealth"],["明志","míng zhì","明确、坚定志向。","make one's ambition clear"],["致远","zhì yuǎn","达到远大目标。","achieve distant goals"],["广才","guǎng cái","增长才干。","broaden one's abilities"],["淫慢","yín màn","放纵懈怠。","indulgence and idleness"],["励精","lì jīng","振奋精神。","exert oneself"],["险躁","xiǎn zào","轻薄浮躁。","rash and restless"],["治性","zhì xìng","修养性情。","cultivate one's temperament"],["枯落","kū luò","凋落、衰残；比喻人年老志衰。","wither and decline"],["穷庐","qióng lú","穷困潦倒之人住的陋室。","humble dwelling"]],focusVocab:[["淡泊","内心恬淡，不追求名利。","他淡泊名利，把更多时间投入教学和研究。","常与“名利”搭配；不是冷漠，而是不被名利牵制。"],["明志","明确、坚定自己的志向。","读书立志，贵在明志并持之以恒。","文言中“明”作使动或意动理解时，要结合句子翻译。"],["致远","达到远大的目标。","要想致远，既要有长远目标，也要脚踏实地。","与“宁静”相联系，强调内心专一是实现远大目标的条件。"],["淫慢","放纵懈怠。“淫”指放纵，“慢”指懈怠。","做事若一味贪图安逸、放纵懈怠，就很难取得进步。","注意这是文言词语，不是现代汉语“淫乱”的常用义。"],["险躁","轻薄浮躁。“险”在这里指轻薄。","遇到问题先冷静分析，不要因险躁而作出冲动决定。","与“宁静”相对，强调心态轻浮急躁的危害。"],["枯落","凋落、衰残；文中比喻人年老志衰、没有作为。","树木若失去生机便会枯落，人的成长也需要持续学习。","这里使用比喻义，不能只按植物凋零的字面理解。"]],qs:[{q:"《诫子书》中“静以修身，俭以养德”强调什么？",a:["通过宁静专一修养身心，通过节俭培养品德","只要节省钱财就能取得成功","学习时不需要确立志向"],correct:0,why:"这句话提出修身养德的两个基本途径：宁静专一与生活节俭。"} ,{q:"“非淡泊无以明志，非宁静无以致远”强调哪种关系？",a:["名利越多，目标越远大","内心淡泊、宁静专一是明确志向和实现远大目标的条件","只要安静就不必学习"],correct:1,why:"句子强调内在心境与志向、目标之间的关系。"}]}
]}
,{"title":"第五单元：人与动物","desc":"活动·探究单元。通过阅读、观察和写作，理解人与动物的关系，亲近自然、尊重生命。","extras":[["任务一｜体会人与动物的关系","默读四篇课文，勾画并摘录重要语句，把握文章的基本立场和态度，了解人与动物相处的不同方式。关注表达观点的语句、人物与动物的细节，以及具体故事背后对自然、生命和人类自身的思考。"],["任务二｜亲近动物，丰富生命体验","选择一种容易观察的动物，观察其外形、活动、习性和与环境的关系。客观、详细地记录观察所得，同时写下真实感受；可观察家养宠物、家禽家畜，也可在适当条件下观察动物园或自然栖息地中的动物。"],["任务三｜记叙与动物的相处","学习本单元课文的写作手法，记叙自己与动物相处中发生的故事。选择有表现力的细节，写出动物的特点以及人与动物之间的互动，表达自己的情感态度。"],["阅读方法｜观点、细节与批注","先把握文章对人与动物关系的基本立场，再关注语言、动作、心理、动物形态行为和环境气氛等细节。运用圈点勾画、写批注、作摘录等方法，并联系自己的真实经历与文章展开对话。"]],"lessons":[{"title":"17 猫","author":"郑振铎","type":"现代散文","intro":"文章回忆家中先后养过的三只猫。第三只猫因外形、性情不讨喜而长期被忽视，后来又在缺乏证据的情况下被“我”误判、惩戒。真相揭开后，“我”陷入深深自责。作品借养猫经历反思偏见、武断和弱者无法为自己辩护的处境。","focus":["梳理三只猫的来历、特点、遭遇和结局，比较“我”对它们的态度。","抓住动作、神态、语言和心理描写，分析第三只猫的悲剧如何形成。","理解“我”由愤怒、惩戒到悔恨、自责的心理变化，思考文章主题。"],"method":"比较三只猫的不同遭遇；关注叙述者态度变化；从关键细节和心理描写理解主题；辨析事实与主观判断。","words":"怂恿、怅然、蜷伏、诅骂、惩戒、妄下断语、虐待、悲楚","structure":{"thesis":"文章通过三次养猫经历，尤其是第三只猫被误判、遭惩戒并最终死去的悲剧，表达作者对生命的同情，反思偏见、主观臆断和对弱者的伤害。","parts":[["第一只猫","活泼可爱，给家人带来快乐，后来病重死亡。"],["第二只猫","聪明活泼、会捉鼠，深受喜爱，后来被人捉走。"],["第三只猫","不活泼、不讨喜，长期被冷落；鸟被咬死后遭到误判和惩戒。"],["真相与悔恨","黑猫衔走黄鸟，证明“我”判断错误；“我”因无法补救过失而深感痛苦。"]]},"vocab":[["怂恿","sǒng yǒng","结合课文语境理解其含义。","contextual meaning"],["怅然","chàng rán","结合课文语境理解其含义。","contextual meaning"],["蜷伏","quán fú","结合课文语境理解其含义。","contextual meaning"],["诅骂","zǔ mà","结合课文语境理解其含义。","contextual meaning"],["惩戒","chéng jiè","结合课文语境理解其含义。","contextual meaning"],["妄下断语","wàng xià duàn yǔ","结合课文语境理解其含义。","contextual meaning"],["虐待","nüè dài","结合课文语境理解其含义。","contextual meaning"],["悲楚","bēi chǔ","结合课文语境理解其含义。","contextual meaning"]],"focusVocab":[["怂恿","鼓动别人去做某事，常含有不赞成的意味。","同学不应怂恿别人违反课堂纪律。","与中性的“建议”不同，“怂恿”往往暗含不恰当的推动。"],["怅然","因失意、不如意而心情不快。","约好的伙伴没有出现，他怅然地走回家。","常用于描写失望、失落的心理状态。"],["蜷伏","弯曲身体伏卧。","小猫蜷伏在窗台的软垫上晒太阳。","是动作和姿态描写，能让读者具体感受到对象的状态。"],["妄下断语","没有弄清事实就轻率地作出结论。","调查尚未结束，不能只凭传闻妄下断语。","这是理解本文主题的关键表达；判断前应核实证据。"],["惩戒","通过处罚使人或事物受到警戒。","教育应讲究方法，而不是简单惩戒。","语气比“提醒”重，含有处罚、警示意味。"]],"qs":[{"q":"第三只猫受到“我”惩戒的直接原因是什么？","a":["它曾多次偷吃食物","“我”未经查证便认定它咬死了鸟","它经常跑到邻居家"],"correct":1,"why":"“我”把猫凝望鸟笼等表现当成证据，后来才发现真正的捕鸟者是黑猫。"},{"q":"第三只猫的悲剧促使“我”反思什么？","a":["养猫需要更多时间","不能凭印象和偏见判断事实，更不能伤害无法辩解的弱者","所有动物都应关在笼子里"],"correct":1,"why":"文章通过误判和无法挽回的后果，反思主观臆断、偏见以及对弱小生命的不公。"}]},{"title":"18 我的白鸽","author":"陈忠实","type":"叙事散文","intro":"作者回忆得到并饲养白鸽的经历，细致观察白鸽的习性、成长和飞翔。白鸽带给作者亲近自然的体验，也使他重新感受到故园山水和乡村生活的美好。","focus":["梳理作者得到、饲养、观察白鸽的过程，概括白鸽的特点。","品味对白鸽动作、姿态、飞翔和环境的细节描写。","理解白鸽带给作者的生命体验，体会人与动物、人与故乡环境之间的联系。"],"method":"按经历梳理叙事线索；抓住动物行为细节；联系景物描写体会情感；理解抒情性语句。","words":"惬意、质朴、畏怯、亭亭玉立、风烛残年、翱翔、陶醉","structure":{"thesis":"文章以饲养白鸽的经历为线索，写出白鸽的灵性、成长和飞翔之美，表现作者对动物生命的亲近与珍爱，也寄托了对故园山水和乡村生活的深厚情感。","parts":[["引出白鸽","老舅谈到养鸽，作者表达对白鸽尤其是纯白鸽子的喜爱与期待。"],["等待与获得","作者等待幼鸽成长，得到白鸽后开始观察、照料它们。"],["观察白鸽","通过喂食、活动、亲近和飞翔等细节，写出白鸽的灵性与生命活力。"],["白鸽与故园","白鸽在山原河川上空飞翔，作者感受到故乡自然景物与生命的和谐。"]]},"vocab":[["惬意","qiè yì","结合课文语境理解其含义。","contextual meaning"],["质朴","zhì pǔ","结合课文语境理解其含义。","contextual meaning"],["畏怯","wèi qiè","结合课文语境理解其含义。","contextual meaning"],["亭亭玉立","tíng tíng yù lì","结合课文语境理解其含义。","contextual meaning"],["风烛残年","fēng zhú cán nián","结合课文语境理解其含义。","contextual meaning"],["翱翔","áo xiáng","结合课文语境理解其含义。","contextual meaning"],["陶醉","táo zuì","结合课文语境理解其含义。","contextual meaning"]],"focusVocab":[["惬意","满意、舒适，常形容人的心情或生活状态。","周末在河边散步，听着水声，让人感到十分惬意。","比“舒服”更强调内心满足、舒畅。"],["质朴","朴实自然，不矫揉造作。","爷爷用质朴的语言讲述童年的故事。","可形容语言、生活方式、性格和艺术风格。"],["畏怯","胆小害怕，不敢向前。","第一次站上舞台，他起初有些畏怯。","与“胆怯”意义相近，常用于描写面对挑战时的心理。"],["翱翔","在空中自由自在地飞翔。","雄鹰在山谷上空翱翔。","多用于描写鸟类高空飞行，也可比喻自由舒展的状态。"]],"qs":[{"q":"作者对白鸽特别期待，主要因为？","a":["白鸽能替他完成农活","白鸽寄托了他对乡村生活、自然生命和美的向往","白鸽可以带来经济收益"],"correct":1,"why":"作者对纯白鸽子的期待与其对乡村生活和自然之美的感受相联系。"},{"q":"对白鸽飞翔及周围山水的描写有什么作用？","a":["只说明白鸽飞行速度快","把白鸽的生命活力与故乡山水联系起来","交代故事发生在城市中心"],"correct":1,"why":"白鸽飞过河流、杨柳、麦田和山岭，动物与故园景色共同构成作者感受到的生命之美。"}]},{"title":"19 大雁归来","author":"利奥波德","type":"科学观察随笔","intro":"作者以长期观察者的身份，记录大雁春季归来、迁徙、觅食、集会和鸣叫等活动。文章既有准确细致的自然观察，也运用拟人等手法赋予大雁鲜明形象，表达对大雁的喜爱、对自然规律的尊重以及对生态联系的思考。","focus":["梳理大雁春季迁徙、归来、觅食、集会等活动，提取观察信息。","分析作者如何将科学观察与生动的文学表达结合起来。","理解文章对大雁群体生活、迁徙规律和人与自然关系的思考。"],"method":"从时间、地点和行为梳理观察记录；区分事实观察与文学表达；品味拟人、比喻和富有情感的语言。","words":"雾霭、缄默、迁徙、沼泽、喧嚷、遗穗、狩猎、目空一切","structure":{"thesis":"作者通过记录大雁迁徙、归来、觅食和集会的行为，表现大雁的群体性、规律性和生命活力，表达对自然生命的尊重与热爱。","parts":[["春雁报春","大雁冲破暖流雾霭归来，作者以此作为春天到来的标志。"],["归来与觅食","描写大雁降落沼泽、向其他雁群发出邀请，以及到玉米地觅食。"],["家庭与群体生活","通过观察雁队数量和孤雁行为，推测雁群的家庭组成及亲缘联系。"],["夜间集会","记录夜晚大雁集会时的声音和活动，呈现其群体生活细节。"],["迁徙与联合","由大雁迁徙联想到跨地域的联合，赞美其长期延续的生命活动。"]]},"vocab":[["雾霭","wù ǎi","结合课文语境理解其含义。","contextual meaning"],["缄默","jiān mò","结合课文语境理解其含义。","contextual meaning"],["迁徙","qiān xǐ","结合课文语境理解其含义。","contextual meaning"],["沼泽","zhǎo zé","结合课文语境理解其含义。","contextual meaning"],["喧嚷","xuān rǎng","结合课文语境理解其含义。","contextual meaning"],["遗穗","yí suì","结合课文语境理解其含义。","contextual meaning"],["狩猎","shòu liè","结合课文语境理解其含义。","contextual meaning"],["目空一切","mù kōng yí qiè","结合课文语境理解其含义。","contextual meaning"]],"focusVocab":[["缄默","闭口不说话，保持沉默。","讨论开始后，他先认真倾听，没有急于打破缄默。","常用于书面语；文中写鸟类在特定情境中的安静状态。"],["迁徙","动物随季节变化等规律进行较长距离的迁移。","候鸟每年按季节迁徙，在不同地区繁殖和越冬。","强调有规律的迁移，不等同于随意搬动。"],["喧嚷","许多人或声音杂乱地大声响起。","操场上同学们的喧嚷声渐渐平息。","与“喧闹”接近，常突出声音嘈杂、热烈。"],["遗穗","收割后遗留在田里的谷物穗子。","秋收后，田里还留有少量遗穗。","理解这一词语有助于读懂大雁到玉米地觅食的内容。"]],"qs":[{"q":"作者如何判断春天已经到来？","a":["看到第一只燕子","观察到一群大雁冲破三月暖流的雾霭归来","听到城市里开始喧闹"],"correct":1,"why":"文章开篇指出，一群大雁归来才是春天到来的鲜明标志。"},{"q":"作者对大雁的描写有什么突出特点？","a":["只有抽象术语，没有情感","把细致观察与拟人、比喻等文学表达结合起来","主要通过虚构故事介绍大雁"],"correct":1,"why":"文章记录迁徙、觅食、集会等真实行为，同时用“辩论”“邀请”等拟人表达呈现大雁的灵性。"}]},{"title":"20 狼","author":"蒲松龄","type":"文言文","intro":"本文选自《聊斋志异》，写屠户夜归途中遇狼，先投骨试图摆脱追赶，继而利用麦场积薪作掩护，最终识破两狼一前一后的诡计并杀死它们。故事表现屠户由惧狼到斗狼的过程，结尾以议论点明狼虽狡猾，终究会被人的智慧和勇气战胜。","focus":["按情节梳理屠户与狼的几次交锋，概括故事发展。","掌握文言实词、虚词及“犬坐”“洞”等词类活用现象。","理解结尾议论的作用，思考故事寓意及传统文化中的狼形象。"],"method":"借助注释疏通文意；抓住动作和情节变化；归纳文言词类活用；结合结尾议论理解寓意。","words":"缀行、并驱、窘、积薪、苫蔽、眈眈、径去、假寐、黠、变诈","structure":{"thesis":"故事通过屠户与两狼斗智斗勇的经过，表现狼的狡猾和屠户的机智勇敢；结尾指出禽兽的诡诈手段有限。","parts":[["遇狼","屠户晚归，途中两狼紧跟不舍。"],["惧狼","屠户投骨，两狼仍交替追赶，屠户处境危急。"],["御狼","屠户奔到麦场，倚靠积薪，放下担子、手持刀具，与狼对峙。"],["杀狼","一狼离开，另一狼假装睡觉；屠户识破诡计，先后杀死两狼。"],["议狼","作者以“禽兽之变诈几何哉？止增笑耳”收束故事，点明寓意。"]]},"vocab":[["缀行","zhuì xíng","结合课文语境理解其含义。","contextual meaning"],["并驱","bìng qū","结合课文语境理解其含义。","contextual meaning"],["窘","jiǒng","结合课文语境理解其含义。","contextual meaning"],["积薪","jī xīn","结合课文语境理解其含义。","contextual meaning"],["苫蔽","shàn bì","结合课文语境理解其含义。","contextual meaning"],["眈眈","","结合课文语境理解其含义。","contextual meaning"],["径去","jìng qù","结合课文语境理解其含义。","contextual meaning"],["假寐","jiǎ mèi","结合课文语境理解其含义。","contextual meaning"],["黠","xiá","结合课文语境理解其含义。","contextual meaning"],["变诈","biàn zhà","结合课文语境理解其含义。","contextual meaning"]],"focusVocab":[["眈眈相向","瞪着眼睛朝着对方，表现凶狠注视的样子。","两只猫隔着门缝眈眈相向，谁也不肯退让。","“眈眈”常写凶狠注视，如“虎视眈眈”。"],["犬坐于前","像狗似的蹲坐在前面。“犬”是名词作状语。","小狗犬坐在门口，等候主人回来。","文言文中名词可活用作状语，表示动作行为的方式。"],["洞其中","在积薪中打洞。“洞”原是名词，这里用作动词。","老鼠洞其中，试图从墙角逃走。","这是名词活用为动词的例子，意思是挖洞。"],["假寐","假装睡觉。“寐”是睡觉。","那只猫闭着眼睛假寐，耳朵却一直在转动。","结合后文可知狼假装睡觉是为了迷惑屠户。"]],"qs":[{"q":"屠户与狼的斗争经历，正确的顺序是？","a":["遇狼—惧狼—御狼—杀狼","惧狼—杀狼—遇狼—御狼","遇狼—御狼—惧狼—议狼"],"correct":0,"why":"故事先写两狼跟随，再写屠户投骨而惧，随后依托积薪防御，最后识破诡计杀狼。"},{"q":"“其一犬坐于前”中的“犬”属于哪种用法？","a":["名词作状语，像狗一样","名词作动词，养狗","形容词作名词，狗群"],"correct":0,"why":"“犬坐于前”意为像狗一样蹲坐在前面，“犬”修饰“坐”，表示动作方式。"}]}]}
