<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>七年级上册语文 · Wonderland</title>
<style>
:root{--ink:#263449;--muted:#68778c;--line:#e4eaf1;--blue:#426b9a;--blue2:#eaf2fb;--gold:#b9783e;--paper:#fff;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7f9fc,#edf3f8);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 20px 64px}.back{color:var(--blue);text-decoration:none;font-size:14px}.hero{padding:34px 0 24px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--gold)}h1{font-size:clamp(30px,5vw,46px);margin:10px 0 8px;letter-spacing:-1px}.sub{color:var(--muted);line-height:1.8;margin:0;max-width:720px}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.pill{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:#596a80}
.unit-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 20px}.unit-btn{border:1px solid var(--line);background:#fff;color:#52647a;padding:11px 17px;border-radius:13px;font-weight:700;cursor:pointer}.unit-btn.active{background:var(--blue);border-color:var(--blue);color:white}
.layout{display:grid;grid-template-columns: minmax(260px,350px) 1fr;gap:18px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px #273d5709}.list{padding:16px}.unit-heading{padding:8px 8px 14px}.unit-heading h2{margin:0 0 5px;font-size:21px}.unit-heading p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.lesson{display:block;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:13px;padding:12px;margin:5px 0;cursor:pointer;color:var(--ink)}.lesson:hover{background:#f7f9fc}.lesson.active{background:var(--blue2);border-color:#cbdced}.lesson strong{display:block;font-size:14px}.lesson small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.detail{padding:clamp(20px,4vw,34px);min-height:500px}.label{font-size:11px;letter-spacing:1.6px;color:var(--gold);font-weight:800}.detail h2{font-size:clamp(25px,4vw,34px);margin:9px 0 4px}.author{color:var(--muted);font-size:14px;margin-bottom:20px}.intro{font-size:15px;line-height:1.9;color:#43536a}.blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.block{background:#f7f9fc;border:1px solid #edf0f5;border-radius:15px;padding:15px}.block h3{font-size:14px;margin:0 0 8px}.block p,.block li{font-size:13px;line-height:1.8;color:#58687d}.block ul{padding-left:18px;margin:0}.question{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.question h3{font-size:16px}.q{padding:13px 0;border-bottom:1px solid #eef1f5}.q p{font-size:14px;line-height:1.7;margin:0 0 9px}.choices{display:grid;gap:7px}.choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;color:#43536a;font-size:13px}.choice:hover{border-color:#9eb6d1}.choice.correct{border-color:#75aa8c;background:#edf8f0}.choice.wrong{border-color:#d89a8e;background:#fff2ef}.feedback{font-size:12px;color:var(--muted);margin-top:7px;min-height:18px}.tip{background:#fff8ed;border:1px solid #f2e4cc;border-radius:14px;padding:14px 16px;color:#795b35;font-size:13px;line-height:1.8;margin-top:20px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.detail{min-height:0}.blocks{grid-template-columns:1fr}.wrap{padding:20px 14px 48px}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../">← 返回 Wonderland 综合学习平台</a>
<header class="hero"><div class="eyebrow">CHINESE · GRADE 7 · FIRST SEMESTER</div><h1>七年级上册 · 语文</h1><p class="sub">以人教版统编教材（2024年版）为依据，围绕课文阅读、语言积累、文本理解与表达训练，逐步建立单元学习内容。</p><div class="meta"><span class="pill">人教版 · 统编版（2024）</span><span class="pill">七年级上册</span><span class="pill">第一、二单元</span></div></header>
<nav class="unit-tabs" aria-label="单元选择"><button class="unit-btn active" data-unit="0">第一单元 · 四季美景</button><button class="unit-btn" data-unit="1">第二单元 · 至爱亲情</button></nav>
<section class="layout"><aside class="panel list"><div class="unit-heading"><h2 id="unitTitle">第一单元：四季美景</h2><p id="unitDesc">学习朗读，品味精彩语句，体会汉语之美。</p></div><div id="lessonList"></div></aside>
<article class="panel detail" id="detail" aria-live="polite"></article></section>
<div class="tip">学习建议：先通读课文并标记不理解的词句，再完成文本理解题。练习题为原创辅助练习，不替代教材课后习题；课文原文请以正式教材为准。</div>
</main>
<script>
const units=[
{title:"第一单元：四季美景",desc:"学习朗读，品味文中的精彩语句，体会汉语之美。",lessons:[
{title:"1 春",author:"朱自清",type:"现代文阅读",intro:"本文以细腻、生动的笔触描绘春回大地的景象，依次呈现春草、春花、春风、春雨以及迎春等画面，表达作者对春天的喜爱与赞美。",focus:["梳理文章描写春景的层次，理解作者由景及人的写作思路。","品味比喻、拟人等修辞手法，体会语言的准确、生动与富有表现力。","学习调动视觉、听觉、嗅觉、触觉等感官描写景物。"],words:"朗润、酝酿、卖弄、宛转、嘹亮、黄晕、烘托、静默、舒活、欣欣然",method:"抓住景物特征；多感官描写；比喻与拟人；动静结合；由景物描写表达情感。",qs:[{q:"《春》一文主体部分描绘春景时，主要采用了怎样的组织方式？",a:["按照春草、春花、春风、春雨、迎春等画面展开","按照春天到夏天的时间顺序展开","按照城市到乡村的空间顺序展开"],correct:0,why:"文章主体部分以多个春景图构成，层次清晰，最后写人们迎春的活动。"},{q:"学习本文的景物描写，最值得借鉴的方法是？",a:["只使用形容词进行静态罗列","抓住特征并调动多种感官，运用修辞细致描写","大量引用抽象议论代替具体描写"],correct:1,why:"《春》通过视觉、听觉、嗅觉、触觉等多角度描写，使景物具体可感。"}]},
{title:"2 济南的冬天",author:"老舍",type:"现代文阅读",intro:"作者抓住济南冬天“温晴”的特点，描写阳光下的小山、薄雪覆盖的小山以及城外远山等景物，展现济南冬天温暖、秀美、安适的特点。",focus:["把握济南冬天“温晴”的总体特征。","理解文章如何围绕中心特征组织不同层次的景物描写。","体会拟人、比喻等表达方式及其营造的亲切氛围。"],words:"响晴、温晴、安适、慈善、肌肤、秀气、宽敞、贮蓄、澄清、空灵",method:"紧扣景物特征；对比衬托；比喻、拟人；由整体到局部；情景交融。",qs:[{q:"作者反复表现济南冬天的哪个突出特点？",a:["寒冷干燥","温晴可爱","风雪交加"],correct:1,why:"“温晴”是贯穿全文的核心特点，阳光、小山、薄雪和远山都围绕这一特点展开。"},{q:"文章写小山“把济南围了个圈儿”，表达效果更接近哪一项？",a:["突出山势险峻、难以攀登","将小山人格化，表现济南冬天的温暖与可亲","说明济南城市面积很小"],correct:1,why:"拟人化表达赋予小山温柔亲切的意味，也突出了济南冬天的安适氛围。"}]},
{title:"3* 雨的四季",author:"刘湛秋",type:"自读课文",intro:"文章描写春雨、夏雨、秋雨、冬雨的不同特点，展现四季雨景的变化，表达作者对雨、对自然和生命的热爱。",focus:["比较四季雨的不同特点，梳理文章结构。","品味富有表现力的词语和富于想象的表达。","体会作者在写景中寄寓的情感。"],words:"花苞、娇媚、棱镜、粗犷、莅临、吝啬、淅沥、干涩、草垛",method:"按季节组织材料；多感官描写；拟人、比喻；融情于景。",qs:[{q:"本文组织材料的主要线索是什么？",a:["一天中的时间变化","四季更替及各季节雨的特点","作者旅行的地点变化"],correct:1,why:"文章以春、夏、秋、冬四季为序，分别描写不同季节的雨。"}]},
{title:"4 古代诗歌四首",author:"曹操、王湾、李白、马致远",type:"古代诗歌",intro:"本课包括《观沧海》《次北固山下》《闻王昌龄左迁龙标遥有此寄》《天净沙·秋思》，从不同角度呈现自然景物、人生感受与诗人情怀。",focus:["理解诗歌意象与诗人情感之间的关系。","掌握借景抒情、虚实结合等常见表现手法。","熟读并背诵，注意节奏、韵律和关键名句。"],words:"沧海、竦峙、萧瑟、潮平、风正、杨花、子规、龙标、断肠",method:"意象分析；借景抒情；炼字赏析；诵读积累。",qs:[{q:"《天净沙·秋思》中最能直接点明游子内心愁苦的句子是？",a:["枯藤老树昏鸦","小桥流水人家","断肠人在天涯"],correct:2,why:"“断肠人在天涯”直抒胸臆，点明羁旅愁思。"}]}]},
{title:"第二单元：至爱亲情",desc:"学习朗读，整体感知课文内容，把握作者的思想感情。",lessons:[
{title:"5 秋天的怀念",author:"史铁生",type:"现代文阅读",intro:"文章回忆作者在双腿瘫痪后与母亲相处的经历，通过母亲隐忍的关怀、反复的叮嘱以及对菊花的牵挂，表现深沉的母爱，也写出作者对母亲的理解、怀念与愧疚。",focus:["梳理“我”的情绪变化和母亲的言行，理解人物形象。","关注反复出现的细节、对话和景物描写，体会其作用。","理解“好好儿活”等语句的深层含义，体会文章情感。"],words:"瘫痪、暴怒、沉寂、侍弄、捶打、憔悴、央求、絮叨、诀别、烂漫",method:"通过人物语言、动作和神态刻画人物；细节描写；借景物变化烘托情感；以反复照应深化主题。",qs:[{q:"母亲反复央求“我”去看花，主要体现了她怎样的心愿？",a:["希望借看花转移“我”的注意力，帮助“我”重新感受生活","希望“我”独自外出，不再需要她照顾","只是为了完成一次普通的家庭活动"],correct:0,why:"母亲希望通过看花唤起儿子对生活的兴趣和信心，体现她深沉而克制的爱。"},{q:"文中多次提到菊花，其重要作用是什么？",a:["只为交代故事发生的季节","作为贯穿全文的线索，寄托对生命与母爱的理解","说明母亲最喜欢园艺"],correct:1,why:"菊花与秋天、母亲的叮嘱及结尾的回忆相联系，承载着珍惜生命、坚强生活的意味。"}]},
{title:"6 散步",author:"莫怀戚",type:"现代文阅读",intro:"文章记叙一家人在田野散步时发生的分歧，展现祖孙三代之间的理解、体谅与责任，表现家庭成员之间温暖的亲情。",focus:["概括散步过程中的事件与矛盾。","理解“我”作出选择时体现的责任意识。","体会文章以小见大的叙事特点和语言节奏。"],words:"分歧、信服、霎时、拆散、委屈、粼粼、各得其所",method:"以小见大；对称句式；细节描写；叙事中融入抒情与议论。",qs:[{q:"散步过程中产生分歧，最终由“我”决定走大路，体现了什么？",a:["“我”只考虑自己的方便","“我”承担起协调家庭关系的责任","家庭成员之间无法沟通"],correct:1,why:"“我”既要照顾母亲，也要顾及孩子，体现中年一代承前启后的责任。"}]},
{title:"7* 散文诗二首",author:"泰戈尔、冰心",type:"自读课文",intro:"《金色花》借孩子化作金色花与母亲嬉戏的想象，表现亲子之间的依恋；《荷叶·母亲》借荷叶庇护红莲的情景，赞美母爱的无私与伟大。",focus:["理解两篇作品的主要意象及其象征意味。","比较儿童视角与抒情视角的表达特点。","体会想象、比喻和象征在抒情散文诗中的作用。"],words:"匿笑、祷告、沐浴、荫蔽、徘徊、遮蔽、菡萏、欹斜",method:"丰富的想象；象征与比喻；借具体形象表达抽象情感。",qs:[{q:"《荷叶·母亲》中，荷叶与红莲的关系主要象征什么？",a:["自然界中普通的植物关系","母亲保护、关爱子女的情景","人与自然之间的冲突"],correct:1,why:"荷叶为红莲遮挡风雨，作者由此联想到母亲对孩子的庇护。"}]},
{title:"8《世说新语》二则",author:"刘义庆（编）",type:"文言文",intro:"《咏雪》写谢家子弟咏雪的故事，表现人物的才思与语言之美；《陈太丘与友期行》通过友人与陈元方的对话，表现诚信、礼貌与明辨是非。",focus:["借助注释疏通文意，积累常见文言词语。","理解人物对话，分析人物形象。","学习用简洁语言表现人物特点的写法。"],words:"内集、儿女、俄而、骤、差可拟、期行、舍去、乃、尊君、家君、引",method:"文言词语积累；结合语境理解句意；通过对话表现人物性格。",qs:[{q:"《陈太丘与友期行》中，友人“下车引之”的原因最恰当的是？",a:["认为自己已经完全正确","意识到自己失信且言语失礼，想向元方表示歉意","想带元方一起离开"],correct:1,why:"友人先失约又对子骂父，听到元方的批评后感到惭愧，因而下车拉元方。"}]}]}
];
let unitIndex=0,lessonIndex=0;
const list=document.getElementById('lessonList'),detail=document.getElementById('detail');
function renderList(){const u=units[unitIndex];document.getElementById('unitTitle').textContent=u.title;document.getElementById('unitDesc').textContent=u.desc;list.innerHTML='';u.lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson'+(i===lessonIndex?' active':'');b.innerHTML='<strong>'+l.title+'</strong><small>'+l.author+' · '+l.type+'</small>';b.onclick=()=>{lessonIndex=i;renderList();renderDetail()};list.appendChild(b)})}
function renderDetail(){const l=units[unitIndex].lessons[lessonIndex];detail.innerHTML='<div class="label">'+l.type.toUpperCase()+'</div><h2>'+l.title+'</h2><div class="author">'+l.author+'</div><p class="intro">'+l.intro+'</p><div class="blocks"><section class="block"><h3>学习重点</h3><ul>'+l.focus.map(x=>'<li>'+x+'</li>').join('')+'</ul></section><section class="block"><h3>字词积累</h3><p>'+l.words+'</p></section><section class="block"><h3>阅读方法</h3><p>'+l.method+'</p></section><section class="block"><h3>学习任务</h3><ul><li>朗读课文，标出关键语句。</li><li>用自己的话概括主要内容。</li><li>选择一处精彩语句，说明表达效果。</li></ul></section></div><section class="question"><h3>随堂检测</h3><div id="quiz"></div></section>';
const quiz=document.getElementById('quiz');l.qs.forEach((q,i)=>{const box=document.createElement('div');box.className='q';box.innerHTML='<p><strong>'+(i+1)+'.</strong> '+q.q+'</p><div class="choices">'+q.a.map((a,j)=>'<button class="choice" data-i="'+j+'">'+String.fromCharCode(65+j)+'. '+a+'</button>').join('')+'</div><div class="feedback"></div>';const buttons=box.querySelectorAll('.choice');buttons.forEach(btn=>btn.onclick=()=>{if(box.dataset.done)return;box.dataset.done='1';const selected=Number(btn.dataset.i);buttons.forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.classList.add('correct')});if(selected!==q.correct)btn.classList.add('wrong');box.querySelector('.feedback').textContent=(selected===q.correct?'回答正确。':'回答不正确。')+q.why});quiz.appendChild(box)})}
document.querySelectorAll('.unit-btn').forEach(b=>b.onclick=()=>{unitIndex=Number(b.dataset.unit);lessonIndex=0;document.querySelectorAll('.unit-btn').forEach(x=>x.classList.toggle('active',x===b));renderList();renderDetail()});
renderList();renderDetail();
</script></body></html>
