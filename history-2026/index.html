3;margin:17px 0 7px}.note{padding:12px 14px;border-left:3px solid #6ba88d;background:#f2f8f4;border-radius:0 9px 9px 0;margin:12px 0}.question{border:1px solid var(--line);border-radius:12px;padding:13px;margin:11px 0}.question p{font-weight:700;margin:0 0 9px}.option{display:block;padding:8px 10px;border-radius:8px;margin:5px 0;background:#f7f9f8;font-size:13px;cursor:pointer}.option input{margin-right:7px}.feedback{font-size:13px;margin-top:8px;line-height:1.6}.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary{border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:#317e68;color:white}.secondary{background:#edf3ef;color:#496457}.hidden{display:none}.footer{text-align:center;color:#89979f;font-size:11px;margin-top:24px}@media(max-width:760px){.layout{grid-template-columns:1fr}.lesson-list{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px}.main{padding:14px}}</style></head><body><main class="wrap"><a class="back" href="../">← 返回 Wonderland 综合学习平台</a><section class="hero"><div class="eyebrow">CHINESE HISTORY · GRADE 7 · VOLUME 1</div><h1>中国历史 · 七年级上册</h1><p>依据教育部组织编写、人民教育出版社 2024 年版教材建设。沿着时间线认识史前社会、夏商周、秦汉以及三国两晋南北朝，学习从史料中提取信息、理解历史变化。</p><div class="stats"><span>4 个单元</span><span>21 课</span><span>知识梳理 · 重点解析 · 基础检测 · 本课回顾</span></div></section><div class="layout"><aside class="side"><h2>课程目录</h2><div id="nav"></div></aside><section class="main"><div class="kicker" id="unit"></div><div class="lesson-title" id="title">请选择一课开始学习</div><div class="tabs"><button class="tab active" data-id="learn">知识梳理</button><button class="tab" data-id="focus">重点解析</button><button class="tab" data-id="quiz">基础检测</button><button class="tab" data-id="review">本课回顾</button></div><div id="learn" class="content"></div><div id="focus" class="content hidden"></div><div id="quiz" class="content hidden"></div><div id="review" class="content hidden"></div></section></div><div class="footer">Wonderland · 中国历史七年级上册</div></main><script>
const units=[["第一单元 史前时期：原始社会与中华文明的起源",[["远古时期的人类活动","元谋人距今约170万年，是我国境内目前已知最早的古人类之一；蓝田人、郧县人也是重要代表。北京人生活在距今约70万—20万年，能制作和使用打制石器，会使用火。山顶洞人距今约3万年，掌握磨光和钻孔技术。","化石、石器和用火遗迹是研究古人类的重要证据。北京人与山顶洞人在体质形态、工具制作和生活技能方面存在进步。",["元谋人","北京人","山顶洞人"],["我国境内目前已知最早的古人类之一是？|元谋人|北京人|山顶洞人|河姆渡人","北京人遗址中的灰烬、烧石和烧骨说明？|会使用火|会种植水稻|会制作青铜器|会使用铁器"],[0,0],["元谋人距今约170万年。","这些遗迹反映北京人已经会使用火。"]],["原始农业与史前社会","距今约1万年，我国南北方都出现人工栽培农作物。水稻、粟和黍的栽培推动农业发展与定居生活。河姆渡遗址距今约7000年，稻作农业发达，房屋主要为干栏式；半坡遗址距今约6000年，居民种植粟、黍，居住半地穴式房屋。","比较河姆渡与半坡，可从地理位置、农业类型、房屋样式、工具和文化遗存入手。农业、家畜饲养、磨制石器和制陶共同推动社会发展。",["农业起源","河姆渡","半坡"],["河姆渡人的房屋主要是？|干栏式建筑|半地穴式房屋|宫殿|窑洞","半坡居民主要种植？|水稻|粟和黍|玉米|甘蔗"],[0,1],["河姆渡人主要居住在干栏式建筑中。","半坡位于黄河流域，居民种植粟、黍。"]],["中华文明的起源","中华文明起源和初步发展具有多元一体特征。距今约5000多年，黄河、长江和西辽河流域出现各具特色的早期文明。良渚古城、陶寺古城等考古发现反映社会分化、城市和早期国家的发展。炎帝、黄帝是传说中的部落联盟杰出代表。","“多元”指不同区域各具特色的文明起源与发展；“一体”指各地文明因素交流汇聚，逐渐形成以中原为引领的文明新格局。传说需要结合考古资料研究。",["多元一体","良渚古城","炎帝和黄帝"],["中华文明起源和初步发展的突出特征是？|多元一体|单一起源|完全外来|彼此隔绝","研究良渚、陶寺等早期文明的重要依据是？|考古发现|影视作品|文学想象|现代传说"],[0,0],["教材明确指出中华文明起源和初步发展具有多元一体特征。","考古遗址和出土遗物是认识早期文明的重要实证。"]]]],["第二单元 夏商周时期：奴隶制王朝的更替和向封建社会的过渡",[["夏商西周王朝的更替","约公元前2070年禹建立夏朝；约公元前1600年商汤灭夏，建立商朝；公元前1046年周武王灭商，建立西周。西周实行分封制。公元前771年西周灭亡，公元前770年周平王东迁洛邑，东周开始。","分封制将宗亲和功臣分封到各地，建立诸侯国。记住夏、商、西周更替及东周开始的关键时间，注意区分西周和东周。",["夏朝建立","商汤灭夏","牧野之战","分封制"],["我国历史上第一个王朝是？|夏朝|商朝|西周|秦朝","西周实行的地方管理制度是？|分封制|郡县制|行省制|科举制"],[0,0],["教材将夏朝定位为我国历史上第一个王朝。","西周实行分封制，分封宗亲和功臣等。"]],["动荡变化中的春秋时期","公元前770年周平王东迁洛邑，东周开始。春秋时期周王室衰微，诸侯争霸，齐桓公、晋文公、楚庄王等先后称霸。铁制农具和牛耕逐渐使用，促进农业生产力发展。","春秋争霸与周王室衰微、诸侯国实力发展有关。齐桓公任用管仲改革，以“尊王攘夷”为号召成为春秋首霸。",["东周开始","诸侯争霸","齐桓公","铁制农具和牛耕"],["东周开始的标志是？|周平王东迁洛邑|武王伐纣|商汤灭夏|秦灭六国","春秋时期诸侯争霸的背景之一是？|周王室衰微|中央集权强化|科举制创立|郡县制普及"],[0,0],["公元前770年周平王东迁洛邑，东周开始。","周王室衰微，诸侯势力崛起。"]],["战国时期的社会变革","战国时期形成齐、楚、燕、韩、赵、魏、秦七雄并立局面。各国为富国强兵推行变法。秦国商鞅变法推行县制、废除井田制、奖励耕织和军功，增强秦国国力，为统一奠定基础。","把变法措施与影响对应：县制加强地方管理；奖励耕织促进经济；奖励军功提高军队战斗力。社会变革与生产力发展、兼并战争密切相关。",["战国七雄","商鞅变法","县制","奖励军功"],["战国七雄中不包括？|齐|楚|秦|越","商鞅变法中有利于加强地方控制的是？|确立县制|奖励耕织|奖励军功|废除井田制"],[3,0],["战国七雄为齐、楚、燕、韩、赵、魏、秦。","县制由国君派官吏治理，有利于加强地方控制。"]],["百家争鸣","春秋战国社会急剧变化，出现百家争鸣。儒家代表有孔子、孟子；道家有老子、庄子；墨家代表墨子；法家代表韩非。各学派提出不同治国和社会主张。","孔子提出“仁”、主张以德治国；孟子主张仁政；老子主张顺应自然、无为而治；墨子主张兼爱、非攻；韩非强调以法治国。",["孔子","老子","墨子","韩非"],["提出“仁”和以德治国思想的是？|孔子|墨子|韩非|庄子","主张“兼爱”“非攻”的学派是？|儒家|道家|墨家|法家"],[0,2],["孔子是儒家学派创始人，提出“仁”等思想。","“兼爱”“非攻”是墨家的代表主张。"]],["夏商周时期的科技与文化","夏商周时期青铜铸造技术发达。甲骨文是我国已知最早的成熟文字，主要刻写在龟甲和兽骨上；铸刻在青铜器上的文字称为金文。春秋战国时期天文、历法、医学、文学和音乐等也有发展。","甲骨文记录商王活动和占卜内容，是研究商朝历史的重要资料。青铜器既有实用价值，也体现礼制与权力。",["青铜器","甲骨文","金文"],["我国已知最早的成熟文字是？|甲骨文|小篆|隶书|楷书","铸刻在青铜器上的文字称为？|甲骨文|金文|小篆|隶书"],[0,1],["甲骨文是我国已知最早的成熟文字。","铸刻在青铜器上的文字称为金文。"]]]],["第三单元 秦汉时期：统一多民族封建国家的建立和巩固",[["秦统一中国","公元前230年至前221年秦灭六国完成统一。秦始皇建立中央集权制度，中央设丞相、太尉、御史大夫，地方推行郡县制；统一文字、货币、度量衡，修筑道路。","秦统一结束长期诸侯割据，建立我国历史上第一个统一的多民族封建国家。郡县长官由中央任免，强化中央对地方的控制。",["秦灭六国","皇帝制度","郡县制","统一文字货币"],["秦完成统一的时间是？|公元前221年|公元前207年|公元前202年|公元220年","秦朝在地方推行？|分封制|郡县制|行省制|三省六部制"],[0,1],["秦于公元前221年完成统一。","秦朝在全国推行郡县制。"]],["秦末农民大起义","秦朝后期赋税、徭役和兵役沉重，刑罚严酷。公元前209年陈胜、吴广在大泽乡起义。项羽、刘邦等力量继续反秦，公元前207年秦朝灭亡。此后刘邦与项羽展开楚汉之争。","秦的暴政是秦末农民起义爆发的根本原因。巨鹿之战中项羽大败秦军主力。注意秦朝灭亡与西汉建立并非同一时间。",["秦的暴政","大泽乡起义","巨鹿之战","楚汉之争"],["陈胜、吴广起义发生于？|公元前209年|公元前221年|公元前202年|公元9年","秦朝灭亡于？|公元前221年|公元前207年|公元前202年|公元25年"],[0,1],["公元前209年陈胜、吴广在大泽乡起义。","公元前207年秦朝灭亡。"]],["西汉建立和“文景之治”","公元前202年刘邦建立汉朝，定都长安，史称西汉。汉初经济凋敝，统治者采取休养生息政策，减轻赋税徭役。汉文帝、汉景帝时期继续轻徭薄赋、提倡节俭，出现“文景之治”。","西汉初年吸取秦亡教训，调整统治政策，恢复经济、稳定社会。文景之治与减轻人民负担、重视农业生产密切相关。",["西汉建立","休养生息","文景之治"],["西汉建立者是？|刘邦|项羽|刘秀|嬴政","“文景之治”得名于？|汉文帝和汉景帝|汉高祖和汉武帝|汉光武帝和汉明帝|秦始皇和秦二世"],[0,0],["刘邦于公元前202年建立西汉。","“文景之治”得名于汉文帝、汉景帝。"]],["大一统王朝的巩固","汉武帝时期西汉国力强盛。政治上颁布推恩令，削弱诸侯王势力；思想上尊崇儒术；经济上统一铸币并加强盐铁经营管理；军事上反击匈奴，大一统局面得到巩固。","理解“大一统”不仅指疆域统一，也包括政治、思想、经济和军事制度整合。将推恩令、尊崇儒术、五铢钱等措施与领域对应。",["汉武帝","推恩令","尊崇儒术","五铢钱"],["汉武帝削弱诸侯王势力的措施是？|推恩令|分封制|科举制|行省制","汉武帝在思想上采取的措施是？|焚书坑儒|尊崇儒术|百家争鸣|独尊法家"],[0,1],["推恩令削弱诸侯王国势力。","汉武帝接受建议，尊崇儒术。"]],["东汉的兴衰","公元25年刘秀建立东汉，定都洛阳。光武帝采取措施恢复经济，出现“光武中兴”。东汉中后期外戚、宦官交替专权，政治腐败。184年张角领导黄巾起义，沉重打击东汉统治；220年东汉灭亡。","东汉前期相对稳定，后期外戚与宦官交替专权，政治局势恶化。黄巾起义后地方势力发展，东汉政权走向瓦解。",["刘秀","光武中兴","外戚宦官","黄巾起义"],["东汉建立者是？|刘邦|刘秀|曹操|曹丕","黄巾起义发生于？|184年|200年|208年|220年"],[1,0],["公元25年刘秀建立东汉。","184年张角领导黄巾起义。"]],["丝绸之路的开通与经营西域","汉武帝时期张骞两次出使西域，促进汉朝与西域联系。以长安为起点，经河西走廊和今新疆地区，通往中亚、西亚并可到达欧洲的交通路线称为丝绸之路。西汉设置西域都护，标志中央政府正式管辖西域。","张骞出使西域促进中原与西域经济文化交流。丝绸之路不仅运输丝绸，也交流物产、技术和文化。西域都护设置于公元前60年。",["张骞出使西域","丝绸之路","西域都护"],["张骞出使西域是在？|汉武帝时期|秦始皇时期|汉光武帝时期|东汉末年","西域都护设置的意义是？|中央政府正式管辖西域|建立东汉|结束楚汉战争|废除郡县制"],[0,0],["张骞在汉武帝时期出使西域。","西域都护设置标志中央政府对西域地区的正式管辖。"]],["秦汉时期的科技与文化","秦汉时期造纸术得到改进。张仲景著《伤寒杂病论》，华佗擅长外科手术和麻醉；司马迁撰写《史记》，是我国第一部纪传体通史。佛教经丝绸之路传入中国，道教在东汉兴起。","蔡伦改进造纸工艺；张仲景被称为“医圣”；华佗发明麻沸散并创编“五禽戏”；《史记》记述从传说中的黄帝到汉武帝时期史事。",["蔡伦","张仲景","华佗","司马迁","佛教与道教"],["被称为“医圣”的是？|华佗|张仲景|扁鹊|李时珍","《史记》的作者是？|司马迁|班固|司马光|张衡"],[1,0],["张仲景著有《伤寒杂病论》。","《史记》由司马迁撰写。"]]]],["第四单元 三国两晋南北朝时期：政权分立与民族交融",[["三国鼎立","200年官渡之战后曹操基本统一北方；208年赤壁之战孙刘联军打败曹操，奠定三国鼎立基础。220年曹丕建立魏，221年刘备建立蜀，229年孙权称帝，吴建立。","官渡之战影响北方格局，赤壁之战影响全国政局走向。注意曹操并非魏国皇帝，魏国建立者是曹丕。",["官渡之战","赤壁之战","魏蜀吴"],["赤壁之战发生于？|200年|208年|220年|229年","三国中最晚建立的是？|魏|蜀|吴|西晋"],[1,2],["208年孙刘联军在赤壁之战中打败曹操。","吴于229年建立，是三国中最晚建立的政权。"]],["西晋的短暂统一和北方各族的内迁","263年魏灭蜀；266年司马炎建立西晋；280年西晋灭吴完成统一。八王之乱消耗国力。匈奴、鲜卑、羯、氐、羌等北方民族陆续内迁。316年西晋灭亡。","西晋统一短暂，与统治集团腐朽、内乱和社会矛盾有关。民族内迁促进民族交往，也带来复杂社会变化。",["西晋建立","八王之乱","民族内迁"],["西晋完成统一的时间是？|220年|263年|280年|316年","西晋灭亡于？|266年|280年|304年|316年"],[2,3],["280年西晋灭吴，完成统一。","316年西晋灭亡。"]],["东晋南朝政治和江南地区开发","317年司马睿建立东晋，定都建康。北方人口南迁，带来劳动力和先进生产技术。南朝包括宋、齐、梁、陈。江南地区农业、手工业和商业发展，经济重心南移趋势逐渐显现。","江南开发原因包括北方人口南迁、自然条件优越、南方社会相对稳定及劳动人民努力。南朝政权顺序为宋、齐、梁、陈。",["东晋建立","南朝","人口南迁","江南开发"],["东晋建立于？|317年|383年|420年|589年","江南开发的重要原因之一是？|北方人口南迁|人口停止流动|农业技术倒退|北方停止生产"],[0,0],["317年司马睿建立东晋。","北方人口南迁带来劳动力和先进生产技术。"]],["北朝政治和北方民族大交融","439年北魏统一北方。北魏孝文帝改革推行汉化措施，包括迁都洛阳、改汉姓、说汉语、穿汉服、与汉族通婚等，促进民族交融，也增强北魏实力。","孝文帝改革顺应民族交融趋势。民族交融是长期交往交流、相互影响的过程，不是某一方简单取代另一方。",["北魏统一北方","孝文帝改革","迁都洛阳","民族交融"],["北魏统一北方的时间是？|386年|439年|494年|581年","孝文帝改革的重要措施是？|迁都洛阳|实行分封制|废除汉字|停止民族交往"],[1,0],["439年北魏统一北方。","迁都洛阳是孝文帝改革的重要措施之一。"]],["三国两晋南北朝时期的科技与文化","祖冲之将圆周率精确到小数点后第七位；贾思勰著《齐民要术》；郦道元著《水经注》。王羲之被称为“书圣”，顾恺之擅长人物画，云冈石窟和龙门石窟体现佛教艺术发展。","人物、著作、领域要准确对应：祖冲之—圆周率；贾思勰—《齐民要术》；郦道元—《水经注》；王羲之—书法；顾恺之—绘画。",["祖冲之","齐民要术","水经注","王羲之","石窟艺术"],["将圆周率精确到小数点后第七位的是？|祖冲之|贾思勰|郦道元|张衡","《齐民要术》的作者是？|郦道元|贾思勰|王羲之|顾恺之"],[0,1],["祖冲之在数学领域取得重要成就。","《齐民要术》由北朝贾思勰撰写。"]],["活动课 从考古发现看中华文明的起源","本课以遗址、墓葬、器物和建筑遗迹等材料，探究中华文明起源和早期发展的多元一体特征。学习从出土文物提取信息，结合地理环境、生产生活和社会组织进行解释。","分析考古材料要关注材质、形制、用途、出土环境和共存遗物。单件器物通常不能独立说明全部历史事实，需要多种证据相互印证。",["考古遗址","出土文物","史料实证"],["考古发现研究早期历史的主要价值是？|提供实物证据|替代所有文字史料|证明所有传说|只供艺术欣赏","分析出土文物较合理的方法是？|结合出土环境和其他材料|只凭外观下结论|只依靠传说|忽略年代"],[0,0],["考古发现提供实物证据，是研究早期历史的重要依据。","需要结合材质、用途、出土环境及其他遗物综合分析。"]]]]];let active={u:0,l:0};const nav=document.getElementById('nav');
units.forEach((u,ui)=>{const h=document.createElement('div');h.className='unit-title';h.textContent=u[0];nav.appendChild(h);const list=document.createElement('div');list.className='lesson-list';u[1].forEach((l,li)=>{const b=document.createElement('button');b.className='lesson-btn';b.textContent='第'+(ui===0?li+1:ui===1?li+4:ui===2?li+9:li+16)+'课 '+l[0];b.addEventListener('click',()=>show(ui,li));list.appendChild(b)});nav.appendChild(list)});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.id)));
function switchTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));['learn','focus','quiz','review'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function show(ui,li){active={u:ui,l:li};const l=units[ui][1][li];document.getElementById('unit').textContent=units[ui][0];document.getElementById('title').textContent=l[0];document.querySelectorAll('.lesson-btn').forEach((b,i)=>b.classList.toggle('active',i===li&&b.parentElement===nav.children[ui*2+1]));document.getElementById('learn').innerHTML='<h3>本课核心内容</h3><p>'+l[1]+'</p><div class="note"><b>关键词：</b>'+l[3].join(' · ')+'</div><h3>历史时空</h3><p>'+['史前时期：从远古人类活动到早期文明形成。','夏商周：王朝更替、分封秩序与社会变革。','秦汉：统一多民族封建国家的建立和巩固。','三国两晋南北朝：政权分立与民族交融。'][ui]+'</p>';document.getElementById('focus').innerHTML='<h3>理解重点</h3><p>'+l[2]+'</p><div class="note"><b>分析方法：</b>联系时代背景，辨析历史事件的原因、过程和影响；材料题先提取材料信息，再联系所学知识。</div>';document.getElementById('review').innerHTML='<h3>本课记忆清单</h3><ul>'+l[3].map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="note">合上教材，尝试复述本课主线，并说明它与前后历史阶段的联系。</div><h3>自我检查</h3><p>能否说清关键时间、人物和制度？能否解释重要变化的原因和影响？能否从史料中找到支持观点的证据？</p>';quiz(l);switchTab('learn')}
function quiz(l){const qs=l[4].map((q,i)=>({q:q.split('|')[0],opts:q.split('|').slice(1),a:l[5][i],why:l[6][i]}));const el=document.getElementById('quiz');el.innerHTML='<h3>本课基础检测</h3><p>选择答案后提交，系统将显示得分与逐题解析。</p><form id="qform">'+qs.map((q,i)=>'<div class="question"><p>'+(i+1)+'. '+q.q+'</p>'+q.opts.map((o,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="feedback" id="fb'+i+'"></div></div>').join('')+'<div class="actions"><button class="primary" type="submit">提交并查看结果</button><button class="secondary" type="button" id="reset">重新作答</button></div></form><div id="score" class="note hidden"></div>';document.getElementById('qform').addEventListener('submit',e=>{e.preventDefault();let n=0;qs.forEach((q,i)=>{const v=document.querySelector('input[name=q'+i+']:checked');const ok=v&&+v.value===q.a;if(ok)n++;document.getElementById('fb'+i).textContent=(ok?'回答正确。':'回答不正确，正确答案：'+q.opts[q.a]+'。')+q.why;document.getElementById('fb'+i).style.color=ok?'#26734f':'#a14d3e'});const s=document.getElementById('score');s.classList.remove('hidden');s.textContent='本课得分：'+n+'/'+qs.length+'。'+(n===qs.length?'全部答对。':'建议根据解析复习后重新作答。')});document.getElementById('reset').addEventListener('click',()=>{document.getElementById('qform').reset();qs.forEach((q,i)=>document.getElementById('fb'+i).textContent='');document.getElementById('score').classList.add('hidden')})}
show(0,0);
