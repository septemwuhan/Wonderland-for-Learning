<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>七年级上册英语统一学习区｜U1—U8</title>
<style>
:root{--bg:#f4f7fb;--paper:#fff;--ink:#26344b;--muted:#66758c;--line:#dce5f0;--blue:#477bd1;--pale:#eaf1ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1240px;margin:auto;padding:20px 22px 30px}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.progress-note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.unit-nav{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:20px 0 14px}
.unit{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 9px;text-align:left;cursor:pointer;color:var(--ink);min-height:76px;transition:.15s}
.unit:hover{border-color:#a9c3ec;transform:translateY(-1px)}
.unit small{display:block;color:var(--muted);font-size:10px;letter-spacing:.07em}
.unit b{display:block;font-size:13px;margin-top:5px;line-height:1.35}
.unit.active{border-color:var(--blue);background:var(--pale);box-shadow:0 0 0 1px var(--blue) inset}
.lesson-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 12px}
.lesson-heading h1{font-size:20px;margin:0}
.lesson-heading p{font-size:12px;color:var(--muted);margin:4px 0 0}
.framebox{background:transparent;min-height:60vh}
iframe{width:100%;height:900px;border:0;display:block;background:transparent;overflow:hidden}
.foot{font-size:11px;color:var(--muted);padding:14px 2px 0}
@media(max-width:900px){.unit-nav{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:520px){.shell{padding:13px 11px 22px}.brand{font-size:17px}.unit-nav{gap:6px;margin:14px 0 12px}.unit{padding:9px 7px;min-height:66px}.unit b{font-size:12px}.lesson-heading h1{font-size:18px}}
</style>
</head>
<body>
<div class="shell">
<header class="head">
  <div>
    <div class="brand">七年级上册英语 · 统一学习区</div>
    <div class="sub">沪教牛津版（2024）｜Unit 1—8｜词汇 · 语法 · 阅读 · 表达 · 单元练习 · 拓展任务</div>
  </div>
  <div class="progress-note">学习记录保存在当前浏览器</div>
</header>
<nav class="unit-nav" id="units" aria-label="选择学习单元"></nav>
<div class="lesson-heading">
  <div><h1 id="currentTitle">Unit 1 · Friendship</h1><p id="currentDesc">围绕友谊主题开展词汇、语法与综合语言训练</p></div>
</div>
<div class="framebox"><iframe id="study" title="七年级上册英语单元学习内容" src="unit1.html"></iframe></div>
<div class="foot">教材栏目与词汇依据沪教牛津版（2024）整理；例句、部分阅读和练习为原创辅助内容，不替代教材。不同单元的学习记录保存在当前浏览器中。</div>
</div>
<script>
const units=[
 ["Friendship","友谊主题：描述朋友、品质与真正的友谊","What makes a strong friendship?"],
 ["School life","校园生活：课程、日常安排与学习习惯","What is your school life like?"],
 ["The seasons","四季主题：季节变化、天气与自然","What do you know about the seasons?"],
 ["The Earth","地球主题：环境保护与生态行动","Why should we learn about the Earth?"],
 ["Off to space","太空探索：行星、航天与科学发现","What is it like to travel in space?"],
 ["Travelling around Asia","亚洲旅行：文化遗产、地图与旅行规划","How do we introduce a city or town?"],
 ["Fun after school","课后活动：校园社团、运动与兴趣","How do you make after-school activities fun and educational?"],
 ["Collecting as a hobby","收藏爱好：藏品、分类与博物馆","Why do people collect things?"]
];
const frame=document.getElementById("study");
const title=document.getElementById("currentTitle");
const desc=document.getElementById("currentDesc");
let active=1;
function selectUnit(n,updateHash=true){
 active=n;
 document.querySelectorAll(".unit").forEach((b,i)=>b.classList.toggle("active",i+1===n));
 title.textContent=units[n-1][2];
 desc.textContent=units[n-1][1];
 const target=n===1?"unit1.html":"course.html#u"+n;
 if(!frame.src.endsWith(target)) frame.src=target;
 if(updateHash) history.replaceState(null,"","#u"+n);
}
document.getElementById("units").innerHTML=units.map((u,i)=>'<button class="unit '+(i===0?'active':'')+'" data-unit="'+(i+1)+'"><small>UNIT '+String(i+1).padStart(2,"0")+'</small><b>'+u[0]+'</b></button>').join("");
document.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",()=>selectUnit(Number(b.dataset.unit))));
function unifyFrame(){
 try{
  const doc=frame.contentDocument;
  if(!doc||!doc.head||!doc.body)return;
  const isU1=!!doc.getElementById("mainNav");
  const isCourse=!!doc.getElementById("lesson");
  let style=doc.getElementById("unified-theme");
  if(!style){style=doc.createElement("style");style.id="unified-theme";doc.head.appendChild(style);}
  style.textContent=`
   :root{--bg:#f4f7fb!important;--paper:#fff!important;--ink:#26344b!important;--muted:#66758c!important;--line:#dce5f0!important;--blue:#477bd1!important;--bluebg:#eaf1ff!important;--pale:#eaf1ff!important;--shadow:none!important}
   html,body{background:#f4f7fb!important;color:#26344b!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
   body{margin:0!important}
   .wrap{max-width:100%!important;margin:0 auto!important;padding:0 2px 24px!important}
   .top{display:none!important}
   ${isCourse?".hero{display:none!important}":""}
   ${isCourse?"#unitNav{display:none!important}":""}
   .nav,.tabs,.subnav{display:flex!important;flex-wrap:wrap!important;gap:7px!important;margin:12px 0 18px!important;padding:0 0 10px!important;border-bottom:1px solid #dce5f0!important}
   .nav button,.tabs button,.subnav button,.secondary{border:1px solid #dce5f0!important;background:#fff!important;color:#66758c!important;border-radius:10px!important;padding:9px 13px!important;font-size:12px!important;font-weight:700!important}
   .nav button.active,.tabs button.active,.subnav button.active{background:#eaf1ff!important;border-color:#a9c3ec!important;color:#315fae!important}
   .panel,.card,.unit,.hero,.tile,.vocab,.word{background:#fff!important;border:1px solid #dce5f0!important;border-radius:15px!important;box-shadow:none!important}
   .unit-hero{background:linear-gradient(120deg,#fff,#eaf2ff)!important;border:1px solid #dce5f0!important;border-radius:18px!important;padding:22px!important;margin:0 0 16px!important}
   .unit-hero .eyebrow{font-size:10px!important;letter-spacing:1.5px!important;color:#477bd1!important;font-weight:800!important}
   .unit-hero h1{font-size:clamp(25px,4vw,38px)!important;line-height:1.2!important;margin:9px 0!important}
   .unit-hero p{font-size:13px!important;color:#66758c!important;line-height:1.7!important;margin:0!important}
   .panel,.card,.unit{padding:18px!important;margin:11px 0!important}
   .grid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))!important;gap:11px!important}
   .tile{padding:16px!important;text-align:left!important;min-height:112px!important}
   .tile:hover{transform:none!important}
   h1,h2,h3{color:#26344b!important}
   .section-head{margin:18px 0 12px!important}
   .section-head h2,.unit h2{font-size:20px!important}
   .notice{border-radius:12px!important}
   .footer{display:none!important}
   @media(max-width:600px){.wrap{padding:0 0 18px!important}.panel,.card,.unit{padding:14px!important}.nav,.tabs,.subnav{gap:6px!important}.nav button,.tabs button,.subnav button{padding:8px 10px!important;font-size:11px!important}}
  `;
  const resize=()=>{const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);frame.style.height=(h+20)+"px";};
  resize();
  if(!frame.dataset.resizeBound){
   const observer=new MutationObserver(resize);observer.observe(doc.body,{childList:true,subtree:true,attributes:true,characterData:true});
   frame.dataset.resizeBound="1";
   doc.addEventListener("click",()=>setTimeout(resize,100),true);
  }
 }catch(e){frame.style.height="1100px";}
}
frame.addEventListener("load",()=>{unifyFrame();setTimeout(unifyFrame,250);setTimeout(unifyFrame,900);});
const match=location.hash.match(/u([1-8])/i);
if(match)selectUnit(Number(match[1]),false);
</script>
</body>
</html>
