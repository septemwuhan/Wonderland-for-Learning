<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>七年级上册英语统一学习区｜U1—U8</title>
<style>
:root{--bg:#f3f6fb;--paper:#fff;--ink:#24344c;--muted:#68778d;--line:#dce4ef;--blue:#356fc2;--pale:#e8f0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1440px;margin:auto;padding:18px 22px 26px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:750;font-size:19px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.progress-note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px}.units{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:18px 0 12px}.unit{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 8px;text-align:left;cursor:pointer;color:var(--ink);min-height:74px}.unit small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em}.unit b{display:block;font-size:13px;margin-top:5px}.unit.active{border-color:var(--blue);background:var(--pale);box-shadow:0 0 0 1px var(--blue) inset}.framebox{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:80vh}iframe{width:100%;height:calc(100vh - 190px);min-height:760px;border:0;display:block;background:#fff}.foot{font-size:12px;color:var(--muted);padding:12px 2px}@media(max-width:800px){.units{grid-template-columns:repeat(4,minmax(0,1fr))}iframe{height:calc(100vh - 245px);min-height:720px}}@media(max-width:480px){.shell{padding:12px}.unit{padding:9px 6px;min-height:66px}.unit b{font-size:12px}.sub{max-width:250px}}
</style></head><body><div class="shell">
<header class="head"><div><div class="brand">📘 七年级上册英语统一学习区</div><div class="sub">沪教牛津版（2024）· Unit 1—8 · 词汇、语法、阅读、表达与单元练习</div></div><div class="progress-note">学习记录保存在当前浏览器</div></header>
<nav class="units" id="units" aria-label="选择学习单元"></nav>
<div class="framebox"><iframe id="study" title="英语单元学习内容" src="unit1.html"></iframe></div>
<div class="foot">各单元练习为辅助学习内容；原创阅读与例句不替代教材。不同单元的记录保存在当前浏览器中。</div>
</div><script>
const names=["Friendship","School life","The seasons","The Earth","Off to space","Travelling around Asia","Fun after school","Collecting as a hobby"];
let active=1;
function selectUnit(n){active=n;document.querySelectorAll(".unit").forEach((b,i)=>b.classList.toggle("active",i+1===n));const frame=document.getElementById("study");frame.src=n===1?"unit1.html":"course.html#u"+n;history.replaceState(null,"","#u"+n);}
document.getElementById("units").innerHTML=names.map((name,i)=>'<button class="unit '+(i===0?'active':'')+'" data-unit="'+(i+1)+'"><small>UNIT '+String(i+1).padStart(2,"0")+'</small><b>'+name+'</b></button>').join("");
document.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",()=>selectUnit(Number(b.dataset.unit))));
const match=location.hash.match(/u([1-8])/i);if(match)selectUnit(Number(match[1]));
</script></body></html>
