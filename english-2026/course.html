<header class="hero"><div class="muted">SHANGHAI EDUCATION PRESS · OXFORD ENGLISH · GRADE 7</div><h1>七年级上册英语学习站</h1><p>沪教牛津版（2024）｜Unit 2—8 学习区</p><p class="muted">按教材单元主题组织词汇、语法、原创阅读、表达任务与即时练习。题目为辅助学习原创编写，不替代教材。</p><div class="actions"><span id="overall" class="muted">已完成 0 题</span><a href="./" class="secondary">返回 Unit 1</a></div></header>

<script>
const units=[
{id:2,title:"School life",key:"What is your school life like?",readingTitle:"My school day",vocab:[["timetable","n. 课程表","Look at the timetable before the first lesson."],["subject","n. 学科","Science is my favourite subject."],["break","n. 课间休息","We talk with friends during the break."],["usually","adv. 通常","I usually walk to school."],["often","adv. 经常","She often reads after dinner."],["sometimes","adv. 有时","We sometimes play table tennis."],["never","adv. 从不","He is never late for class."],["daily","adj./adv. 每日的","Write about your daily life."]],grammarTitle:"一般现在时（The simple present）",grammar:"一般现在时用于描述经常发生的动作、习惯、客观事实和稳定状态。\n肯定句：I/You/We/They + 动词原形；He/She/It + 动词-s/-es。\n否定句：主语 + do not / does not + 动词原形。\n一般疑问句：Do/Does + 主语 + 动词原形？\n频度副词 usually、often、sometimes、never 通常放在行为动词之前，be 动词之后。",examples:["I usually get to school at 7:30.","She doesn't have PE on Friday.","How often do you read English?","He is often busy after school."],reading:"My school day\nI get up at six thirty on weekdays. After breakfast, I walk to school with my neighbour. Our first lesson starts at eight. I enjoy English and science because we do interesting activities in class.\nWe have a short break in the morning. At lunchtime, I eat with my classmates. School finishes at four, but I sometimes stay for the reading club. I usually do my homework after dinner. My school day is busy, but I learn something new every day.",speaking:"采访同学的一天：What time do you get up? How do you go to school? Which subject do you like best? How often do you read after school?",writing:"写一封简短邮件介绍自己的校园生活。按时间顺序写上学、课程、午餐、课后活动和感受；至少使用3个频度副词。",qs:[
["My sister ____ to school by bus every day.",["go","goes","going","is go"],1,"主语 my sister 是第三人称单数，谓语用 goes。"],
["We ____ have lessons on Sunday.",["doesn't","aren't","don't","isn't"],2,"主语 we 的一般现在时否定句用 don't + 动词原形。"],
["How often ____ your father cook dinner?",["do","does","is","are"],1,"your father 是第三人称单数，疑问句用 does。"],
["Which sentence is correct?",["He study English every day.","He studies English every day.","He studying English every day.","He does studies English."],1,"第三人称单数肯定句中，study 变为 studies。"],
["I ____ have breakfast at school. I eat at home.",["never","usually","often","always"],0,"根据后一句“在家吃”，never（从不）最符合语境。"],
["频度副词通常放在行为动词____。",["之后","之前","句末固定位置","主语之前"],1,"频度副词通常位于行为动词之前。"],
["Does Amy ____ music after school?",["listens to","listening to","listen to","listened to"],2,"Does 后接动词原形 listen。"],
["“课程表”对应的英语是____。",["subject","timetable","break","lesson"],1,"timetable 意为课程表。"],
["My classes ____ at 8:00 every morning.",["starts","start","starting","is start"],1,"主语 classes 为复数，谓语用原形 start。"],
["Which question asks about frequency?",["Where do you study?","How often do you swim?","When is lunch?","Who is your teacher?"],1,"How often 询问频率。"],
["The reading club ____ on Tuesdays.",["meet","meets","meeting","to meet"],1,"club 作单数主语，谓语用 meets。"],
["“她通常在晚饭后做作业。”正确表达是____。",["She usually do homework after dinner.","She usually does her homework after dinner.","She does usually her homework after dinner.","She usually doing homework after dinner."],1,"第三人称单数 does her homework；频度副词置于行为动词前。"]]},
{id:3,title:"The seasons",key:"What do you know about the seasons?",readingTitle:"The four seasons in Auckland",vocab:[["season","n. 季节","Which season do you like best?"],["spring","n. 春天","Flowers come out in spring."],["summer","n. 夏天","It is warm and sunny in summer."],["autumn","n. 秋天","Leaves turn yellow in autumn."],["winter","n. 冬天","It can be cold in winter."],["mild","adj. 温和的","The city has a mild climate."],["pleasant","adj. 令人愉快的","The weather is pleasant today."],["temperature","n. 温度","The temperature is low in the morning."]],grammarTitle:"形容词（Adjectives）",grammar:"形容词用于描述人或事物的性质、状态和特征。\n常见位置：be/seem/look/feel 等系动词之后（The weather is warm.）；名词之前作定语（a sunny day）。\n部分形容词有比较级和最高级：warm—warmer—warmest；hot—hotter—hottest；beautiful—more beautiful—most beautiful。\n比较级常与 than 连用；最高级常与 the 连用。",examples:["Spring is warm and beautiful.","The days are longer in summer than in winter.","Autumn is the most colourful season for me.","The weather feels pleasant."],reading:"The four seasons in Auckland\nAuckland is in the south of the world, so its seasons are opposite to those in many places in the north. When it is summer in China, it is winter in Auckland.\nSpring is often mild, and flowers appear in gardens. Summer is warm and bright, but it is not always very hot. In autumn, the air becomes cooler and the leaves change colour. Winter is usually cool and wet. People choose different outdoor activities in different seasons.",speaking:"比较你最喜欢的两个季节：What is the weather like? What can people do? Which season is warmer/colder? Why do you prefer it?",writing:"写一篇介绍最喜欢季节的短文。包括天气、自然景象、活动和个人感受；至少使用4个形容词和1个比较级。",qs:[
["The weather is ____ today. Let's go outside.",["sun","sunny","sunnily","sunned"],1,"sunny 是形容词，可作表语描述天气。"],
["Which word is an adjective?",["beauty","beautiful","beautifully","beautify"],1,"beautiful 是形容词；beauty 是名词，beautifully 是副词。"],
["Winter is usually ____ than summer.",["cold","colder","coldest","the colder"],1,"than 提示使用比较级 colder。"],
["This is ____ day of the year.",["hot","hotter","the hottest","hottest"],2,"最高级前通常加 the。"],
["The flowers look ____ in spring.",["beautiful","beautifully","beauty","beautify"],0,"look 在此为系动词，后接形容词。"],
["“温和的气候”可表达为____。",["a mild climate","a mildly climate","a climate mild","mildly weather"],0,"mild 是形容词，修饰名词 climate。"],
["Which sentence is correct?",["The weather is beautifully.","The weather is beautiful.","The weather beautiful is.","The weather are beautiful."],1,"be 动词后用形容词作表语；weather 通常作不可数名词，谓语用 is。"],
["The days in summer are often ____ than those in winter.",["long","longer","longest","the longest"],1,"比较两者用比较级 longer。"],
["Which is the correct spelling?",["hotter","hoter","hottestest","more hot"],0,"hot 的比较级为 hotter，需双写 t。"],
["“秋天”对应的英语是____。",["spring","summer","autumn","winter"],2,"autumn 意为秋天。"],
["Auckland's seasons are ____ to those in northern places.",["opposite","oppositely","opposition","oppose"],0,"be opposite to 意为与……相反。"],
["Which sentence uses an adjective after a linking verb?",["She sings beautifully.","The air feels cool.","He runs quickly.","They speak loudly."],1,"feel 在此为系动词，后接形容词 cool。"]]},
{id:4,title:"The Earth",key:"Why should we learn about the Earth?",readingTitle:"Protect our blue planet",vocab:[["Earth","n. 地球","The Earth is our home."],["planet","n. 行星","Earth is a planet."],["ocean","n. 海洋","The ocean is home to many animals."],["pollution","n. 污染","Air pollution is a serious problem."],["protect","v. 保护","We should protect the environment."],["rubbish","n. 垃圾","Put the rubbish in the bin."],["forest","n. 森林","Forests are important to life."],["energy","n. 能源；能量","Solar energy comes from the Sun."]],grammarTitle:"There is / There are",grammar:"There be 句型表示“某地存在某人或某物”。\nThere is + 单数可数名词/不可数名词；There are + 复数可数名词。\n一般疑问句：Is/Are there ...? 简短回答：Yes, there is/are. / No, there isn't/aren't.\n否定句：There isn't / There aren't ...\n就近原则：There be 后有多个并列主语时，be 动词通常与最近的主语保持一致。",examples:["There is a river near our school.","There are many trees in the park.","Is there any water in the bottle?","There is a book and two pens on the desk."],reading:"Protect our blue planet\nThe Earth is the only home we know. There are oceans, forests, rivers and many kinds of animals on our planet. However, people create too much rubbish and use too much energy. Air and water pollution can harm people, plants and animals.\nThere are simple ways to help. We can save water, turn off lights, use both sides of paper and put rubbish into the right bins. We can also plant trees and walk or cycle for short trips. Small actions, when many people do them, can make a difference.",speaking:"看图描述环境：What can you see? Is there any rubbish? Are there enough trees? What should people do to protect the Earth?",writing:"写一篇保护地球的倡议短文。说明一个环境问题、它的影响和至少三项可行措施。",qs:[
["There ____ a big tree behind the library.",["are","is","be","am"],1,"a big tree 是单数，使用 There is。"],
["There ____ many students in the playground.",["is","am","are","be"],2,"many students 是复数，使用 There are。"],
["____ there any milk in the fridge?",["Are","Is","Do","Does"],1,"milk 是不可数名词，使用 Is there。"],
["There ____ two books and a pen on the desk.",["is","are","be","am"],1,"就近原则：离 be 最近的是 two books，使用 are。"],
["There ____ any clean water in the bottle.",["isn't","aren't","don't","doesn't"],0,"water 是不可数名词，否定形式为 There isn't。"],
["Which sentence is correct?",["There is many trees.","There are much trees.","There are many trees.","There be many trees."],2,"trees 为复数，使用 There are。"],
["“地球”在英语中通常写作____。",["the earth","Earth","an earths","earths"],1,"作为行星名称时通常写作 Earth，首字母大写。"],
["We should ____ the environment.",["protection","protect","protective","protected"],1,"should 后接动词原形 protect。"],
["There ____ some rubbish on the beach.",["are","is","be","am"],1,"rubbish 通常作不可数名词，使用 is。"],
["____ any parks near your home?",["Is there","Are there","There are","There is"],1,"parks 为复数，疑问句用 Are there。"],
["Which action helps save energy?",["Leave lights on.","Turn off unused lights.","Keep the tap running.","Throw batteries into rivers."],1,"关掉不用的灯可以节约能源。"],
["“保护环境”对应的英语是____。",["protect the environment","pollute the environment","use more energy","create rubbish"],0,"protect the environment 意为保护环境。"]]},
{id:5,title:"Off to space",key:"What is it like to travel in space?",readingTitle:"A trip to a space hotel",vocab:[["space","n. 太空","People study the Earth from space."],["astronaut","n. 宇航员","An astronaut works in space."],["planet","n. 行星","Mars is a planet."],["rocket","n. 火箭","A rocket carries people into space."],["Moon","n. 月球","The Moon goes around the Earth."],["future","n. 将来","What will life be like in the future?"],["float","v. 漂浮","Things can float in a spacecraft."],["spacecraft","n. 宇宙飞船","The spacecraft travels around the Earth."]],grammarTitle:"一般将来时：will 与 be going to",grammar:"will + 动词原形：表示将来会发生的事、临时决定或预测。\nbe going to + 动词原形：常表示已有计划、打算，或有迹象表明即将发生。\n否定：will not (won't)；am/is/are not going to。\n疑问：Will + 主语 + 动词原形？ / Am/Is/Are + 主语 + going to + 动词原形？",examples:["People will travel farther into space.","We are going to visit the science museum tomorrow.","I think robots will help astronauts.","Look at those clouds! It is going to rain."],reading:"A trip to a space hotel\nIn the future, some people may spend a holiday in a space hotel. They will travel there in a spacecraft. During the journey, they will see the blue Earth through the windows.\nIn the hotel, visitors are going to try life without normal gravity. They will float while they eat and exercise. They are also going to learn how astronauts work. A space holiday will be exciting, but it may cost a lot of money. Scientists still need to solve many problems before it becomes common.",speaking:"设计一次太空旅行：Where will you go? What are you going to take? What will you do there? What problems may you face?",writing:"写一篇关于梦想太空旅行的帖子，介绍目的地、计划活动、准备物品和期待。",qs:[
["People ____ live on Mars one day.",["will","are","did","does"],0,"one day 表示未来某一天，使用 will + 动词原形。"],
["We ____ visit the science museum this Saturday. We have bought the tickets.",["will to","are going to","going","are go to"],1,"已有安排或计划可用 be going to。"],
["She will ____ an astronaut in the future.",["is","be","being","was"],1,"will 后接动词原形 be。"],
["They ____ travel to the Moon next year.",["won't","doesn't","aren't","not will"],0,"will 的否定形式是 will not / won't。"],
["____ you help me carry this bag? — Sure.",["Are","Do","Will","Did"],2,"临时请求可用 Will you...?"],
["Look at the dark clouds. It ____ rain.",["will to","is going to","going","is go to"],1,"有明显迹象时常用 be going to 表示即将发生。"],
["Which sentence is correct?",["He will goes to space.","He will go to space.","He will going to space.","He wills go to space."],1,"will 后接动词原形。"],
["An ____ travels and works in space.",["astronaut","artist","engineer","tourist"],0,"astronaut 意为宇航员。"],
["The Moon goes around the ____.",["Sun","Mars","Earth","rocket"],2,"月球围绕地球运行。"],
["We ____ going to watch a space film tonight.",["am","is","are","be"],2,"主语 we 对应 are。"],
["Which expresses a plan?",["I am going to read about Mars tonight.","Maybe it will snow one day.","I think life will change.","I will answer the phone."],0,"be going to 常用于表达事先计划。"],
["“漂浮”对应的英语动词是____。",["float","flyer","flow","fall"],0,"float 意为漂浮。"]]},
{id:6,title:"Travelling around Asia",key:"How do we introduce a city or town?",readingTitle:"A weekend in Shanghai",vocab:[["Asia","n. 亚洲","China is in Asia."],["capital","n. 首都","Beijing is the capital of China."],["guide","n./v. 导游；指引","A guide can show visitors around."],["temple","n. 寺庙","The old temple attracts visitors."],["famous","adj. 著名的","The city is famous for its food."],["attraction","n. 景点；吸引力","The museum is a popular attraction."],["direction","n. 方向","Can you tell me the direction?"],["visitor","n. 游客","Many visitors come here every year."]],grammarTitle:"第一类条件句（Conditional sentences 1）",grammar:"第一类条件句谈论真实或有可能实现的条件及其结果。\nIf + 一般现在时，主句 + will/can/may + 动词原形。\nIf it rains, we will stay indoors.\nif 从句可以放在句首或句末；放句首时，通常用逗号隔开。\n在条件状语从句中，通常不用 will 表示将来，而用一般现在时。",examples:["If you visit Shanghai, you can see the Bund.","If we have time, we will visit the museum.","You will miss the bus if you get up late.","If it rains tomorrow, we may change our plan."],reading:"A weekend in Shanghai\nShanghai is a famous city in eastern China. Visitors can enjoy modern buildings along the Huangpu River and learn about history in museums. The Bund is a popular place for a walk, especially in the evening.\nIf you want to see the city from above, you can visit a tall observation deck. If you prefer traditional culture, you can explore an old garden. Try local food when you have time. If you plan your route carefully, you will enjoy more places in one weekend.",speaking:"向外国游客介绍所在城市：If you have one day here, where will you go? What can visitors see and do? How can they get there?",writing:"写一份亚洲城市旅游指南，包含城市概况、两个景点、交通建议和旅行提示。",qs:[
["If it ____ tomorrow, we will stay at home.",["will rain","rains","rain","rained"],1,"第一类条件句 if 从句用一般现在时，主语 it 用 rains。"],
["If you study hard, you ____ make progress.",["will","are","did","have"],0,"主句可用 will + 动词原形表示可能结果。"],
["Which sentence is correct?",["If he will come, I will call you.","If he comes, I will call you.","If he come, I call you.","If he came, I will call you."],1,"if 从句用一般现在时 comes，主句用 will call。"],
["We will miss the train if we ____ now.",["don't leave","won't leave","didn't leave","aren't leave"],0,"if 从句中用一般现在时否定 don't leave。"],
["If you visit Beijing, you ____ see the Great Wall.",["can","did","are","has"],0,"can + 动词原形表示能力或可能性。"],
["“首都”对应的英语是____。",["capital","capitol","captain","chapter"],0,"capital 意为首都。"],
["If 从句放在句首时，主从句之间通常用____。",["句号","逗号","问号","冒号"],1,"If 从句位于句首时，通常用逗号与主句隔开。"],
["Which is a good travel suggestion?",["If you visit the city, try its local food.","If you will visit, tried food.","If visiting city, you tries food.","If you visited, will try food."],0,"条件从句用一般现在时，主句祈使句也可提出建议。"],
["Shanghai is famous ____ its food and modern skyline.",["to","for","with","at"],1,"be famous for 意为因……而著名。"],
["If we take a map, we ____ get lost easily.",["won't","aren't","didn't","doesn't"],0,"主句用 won't 表示将不会。"],
["A person who visits a place is a ____.",["visitor","captain","capital","direction"],0,"visitor 意为游客、访问者。"],
["If the weather is fine, we ____ the old garden.",["visit","visited","will visit","visiting"],2,"主句用 will visit 表示将来结果。"]]},
{id:7,title:"Fun after school",key:"How do you make after-school activities fun and educational?",readingTitle:"The Clubs Fair",vocab:[["club","n. 社团","I joined the science club."],["activity","n. 活动","What activities do you enjoy?"],["join","v. 加入","She joined the music club."],["practice","n./v. 练习","We practise speaking every day."],["performance","n. 表演","The school put on a performance."],["experience","n./v. 经历；体验","It was a great experience."],["creative","adj. 有创造力的","The art club is creative and fun."],["competition","n. 比赛","Our team won the competition."]],grammarTitle:"一般过去时（The simple past）",grammar:"一般过去时表示过去某个时间发生的动作或存在的状态。\n规则动词通常加 -ed：play—played；以辅音字母+y结尾变 y 为 i 加 -ed：study—studied；部分动词是不规则变化：go—went，have—had，see—saw。\n否定句：did not + 动词原形；一般疑问句：Did + 主语 + 动词原形？\n常见时间标志：yesterday、last week、two days ago、in 2024。",examples:["We visited the school clubs fair yesterday.","I joined the chess club last term.","Did you enjoy the show?","She didn't take part in the competition."],reading:"The Clubs Fair\nLast Friday, our school held a clubs fair in the hall. Each club prepared a small activity for new students. The science club showed a simple experiment, and the music club performed two songs.\nI visited the photography club first. Its members showed us how to take better pictures. Then I tried a chess game with a student from the chess club. I enjoyed the afternoon and joined the photography club. I hope to learn something new this term.",speaking:"介绍一次课后活动：What did you do? Who did you go with? What did you learn? Did you enjoy it? Why?",writing:"写一段课后活动经历，交代时间、地点、参与者、活动过程和感受。注意动词过去式。",qs:[
["We ____ the school fair last Friday.",["visit","visits","visited","visiting"],2,"last Friday 是过去时间，visit 的过去式为 visited。"],
["She ____ to the music club yesterday.",["go","goes","went","going"],2,"go 的不规则过去式是 went。"],
["They ____ play football last weekend.",["don't","doesn't","didn't","aren't"],2,"一般过去时否定句用 didn't + 动词原形。"],
["____ you enjoy the performance?",["Do","Did","Are","Were"],1,"一般过去时疑问句用 Did + 主语 + 动词原形。"],
["He ____ a new camera last month.",["buy","buys","bought","buyed"],2,"buy 的过去式是不规则变化 bought。"],
["Which sentence is correct?",["Did she joined the club?","Did she join the club?","Does she joined the club?","Did she joins the club?"],1,"Did 后接动词原形 join。"],
["“参加；加入一个社团”可表达为____。",["join a club","make a club","do a club","take a club"],0,"join a club 意为加入社团。"],
["We ____ a science show two days ago.",["see","saw","seen","seeing"],1,"see 的过去式是 saw。"],
["The students ____ happy after the game.",["was","were","is","be"],1,"主语 students 是复数，过去式 be 动词用 were。"],
["Which is a past-time expression?",["tomorrow","next week","yesterday","every day"],2,"yesterday 表示昨天，是过去时间标志。"],
["I ____ take part in the competition because I was ill.",["didn't","wasn't","don't","haven't"],0,"一般过去时行为动词否定用 didn't take。"],
["“经历；体验”作为名词可以用____表达。",["experience","experiment","exciting","exercise"],0,"experience 可作名词，表示经历、体验。"]]},
{id:8,title:"Collecting as a hobby",key:"Why do people collect things?",readingTitle:"Stamps have stories to tell",vocab:[["collect","v. 收集","My uncle collects old coins."],["collection","n. 收藏品；收集","She has a large stamp collection."],["collector","n. 收藏者","He is a stamp collector."],["stamp","n. 邮票","This stamp is from Japan."],["hobby","n. 爱好","Reading is my favourite hobby."],["valuable","adj. 有价值的","Some old stamps are valuable."],["different","adj. 不同的","People collect different things."],["belong","v. 属于","This book belongs to me."]],grammarTitle:"人称代词与物主限定词/代词",grammar:"人称代词主格作主语：I, you, he, she, it, we, they。宾格作动词或介词宾语：me, you, him, her, it, us, them。\n形容词性物主代词放在名词前：my, your, his, her, its, our, their + 名词。\n名词性物主代词独立使用，不再接名词：mine, yours, his, hers, ours, theirs。\n例：This is my stamp. The stamp is mine. Please give it to me.",examples:["She likes stamps. I often talk to her.","This is our collection. Theirs is on the shelf.","That camera is his, not mine.","These stamps belong to them."],reading:"Stamps have stories to tell\nPeople collect many things, such as stamps, coins, postcards and model cars. A collection can show what a person is interested in. Some collectors choose one topic, for example animals or famous buildings.\nStamps are small, but they can tell interesting stories. They may show important people, special events, animals or places. When collectors exchange stamps, they also share information and make friends. A collection does not have to be expensive. The most important thing is the interest and the stories behind it.",speaking:"开展班级收藏调查：What do you collect? How long have you collected them? Which item is your favourite? Why is it special?",writing:"写一篇介绍个人收藏的短文，说明收藏物、数量、开始时间、最喜欢的一件藏品及原因。",qs:[

const storeKey="oxford2026_u2u8_progress";
function load(){try{return JSON.parse(localStorage.getItem(storeKey))||{done:0,right:0,wrong:[]}}catch(e){return{done:0,right:0,wrong:[]}}}
function save(d){localStorage.setItem(storeKey,JSON.stringify(d));updateStats()}
function updateStats(){const d=load();document.getElementById("overall").textContent="已完成 "+d.done+" 题 · 正确率 "+(d.done?Math.round(d.right/d.done*100)+"%":"暂无")}
let current=0;
function nav(){document.getElementById("unitNav").innerHTML=units.map((u,i)=>'<button class="unitbtn '+(i===current?"active":"")+'" data-u="'+i+'"><small>UNIT '+String(u.id).padStart(2,"0")+'</small><b>'+u.title+'</b><small>'+u.key+'</small></button>').join("");document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{current=+b.dataset.u;nav();render()})}
function render(){const u=units[current],root=document.getElementById("lesson");root.innerHTML='<section class="unit"><div class="muted">UNIT '+String(u.id).padStart(2,"0")+'</div><h2>'+u.title+'</h2><p><b>Key question:</b> '+u.key+'</p><div class="tabs"><button class="active" data-tab="words">词汇</button><button data-tab="grammar">语法</button><button data-tab="reading">阅读</button><button data-tab="output">表达任务</button><button data-tab="quiz">题库练习</button></div><div class="tab active" id="words"><div class="grid">'+u.vocab.map(v=>'<div class="vocab"><b>'+v[0]+'</b><p>'+v[1]+'</p><p>'+v[2]+'</p></div>').join("")+'</div><p class="muted">本页先列出本单元核心主题词，后续将按教材词汇表继续补齐词形、搭配和拓展词。</p></div><div class="tab" id="grammar"><h3>'+u.grammarTitle+'</h3><div class="rule">'+u.grammar.replace(/\n/g,"<br>")+'</div>'+u.examples.map(x=>'<div class="example">'+x+'</div>').join("")+'</div><div class="tab" id="reading"><h3>'+u.readingTitle+'</h3><p class="reading">'+u.reading+'</p><div class="notice">阅读文本为原创辅助材料。建议先独立阅读，再用题目检查细节理解、词汇和主题概括。</div></div><div class="tab" id="output"><h3>口语任务</h3><p>'+u.speaking+'</p><h3>写作任务</h3><p>'+u.writing+'</p><div class="notice">完成后检查：主题是否明确？信息是否完整？是否正确使用本单元目标语法？句首大写和标点是否正确？</div></div><div class="tab" id="quiz"><div class="actions"><b>本单元练习</b><span class="muted" id="score">0 / '+u.qs.length+'</span></div><div class="progress"><i id="bar" style="width:0%"></i></div><div id="questions"></div><button class="secondary" id="retry">重做本单元</button></div></section>';
root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{root.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));root.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.id===b.dataset.tab))});
renderQuestions(u);root.querySelector("#retry").onclick=()=>renderQuestions(u)}
function renderQuestions(u){const host=document.getElementById("questions");let answered=0,right=0;host.innerHTML=u.qs.map((q,i)=>'<div class="q" data-q="'+i+'"><div class="muted">第 '+(i+1)+' 题</div><div class="qtitle">'+(i+1)+'. '+q[0]+'</div><div class="choices">'+q[1].map((c,j)=>'<button class="choice" data-c="'+j+'">'+String.fromCharCode(65+j)+'. '+c+'</button>').join("")+'</div><div class="feedback"></div></div>').join("");host.querySelectorAll("[data-q]").forEach((box,i)=>{const q=u.qs[i];box.querySelectorAll("[data-c]").forEach(btn=>btn.onclick=()=>{if(box.dataset.answered)return;box.dataset.answered="1";answered++;const selected=+btn.dataset.c,ok=selected===q[2];if(ok)right++;box.querySelectorAll(".choice").forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("correct");if(j===selected&&!ok)x.classList.add("wrong")});const fb=box.querySelector(".feedback");fb.innerHTML=(ok?"回答正确。":"正确答案："+q[1][q[2]]+"。")+q[3];fb.classList.add("show");let d=load();d.done++;if(ok)d.right++;else d.wrong.unshift({unit:"U"+u.id,question:q[0],answer:q[1][q[2]],explanation:q[3]});d.wrong=d.wrong.slice(0,100);save(d);document.getElementById("score").textContent=right+" / "+u.qs.length;document.getElementById("bar").style.width=(answered/u.qs.length*100)+"%"})})}
nav();render();updateStats();
</script></body></html>
